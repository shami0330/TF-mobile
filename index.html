  --green:#34C759;--red:#FF3B30;--blue:#007AFF;--orange:#FF9500;--yellow:#FFCC00;--teal:#32ADE6;--purple:#AF52DE;--gray:#8E8E93;
  --g1:#34C759;--g2:#0A84FF;--g3:#FF9F0A;--g4:#FF453A;
  --blur-bg:rgba(249,249,251,.8);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --nav-h:44px;--tab-h:50px;--tf:1;
  --ease:cubic-bezier(.32,.72,0,1);
  --font:"VazirmatnTF",-apple-system,"SF Arabic","SF Pro Text","Geeza Pro",system-ui,sans-serif;
}
/* حالت تاریک (دستی) | Dark Theme Manual: وقتی کاربر در تنظیمات «تاریک» را انتخاب کند */
:root[data-theme=dark]{
  --tint:#FB7185;--tint-2:#FDA4AF;--tint-weak:rgba(251,113,133,.17);
  --bg:#000;--card:#1C1C1E;--card-2:#2C2C2E;
  --label:#fff;--label-2:rgba(235,235,245,.64);--label-3:rgba(235,235,245,.32);--label-4:rgba(235,235,245,.16);
  --sep:rgba(84,84,88,.6);--fill:rgba(120,120,128,.24);--fill-2:rgba(120,120,128,.36);
  --green:#30D158;--red:#FF453A;--blue:#0A84FF;--orange:#FF9F0A;
  --g1:#30D158;--g2:#0A84FF;--g3:#FF9F0A;--g4:#FF453A;
  --blur-bg:rgba(24,24,26,.78);--shadow:0 0 0 .5px rgba(255,255,255,.04);
}
/* حالت تاریک (خودکار) | Dark Theme Auto: اگر گوشی در حالت تاریک باشد و کاربر چیزی انتخاب نکرده باشد */
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]):not([data-theme=dark]){
    --tint:#FB7185;--tint-2:#FDA4AF;--tint-weak:rgba(251,113,133,.17);
    --bg:#000;--card:#1C1C1E;--card-2:#2C2C2E;
    --label:#fff;--label-2:rgba(235,235,245,.64);--label-3:rgba(235,235,245,.32);--label-4:rgba(235,235,245,.16);
    --sep:rgba(84,84,88,.6);--fill:rgba(120,120,128,.24);--fill-2:rgba(120,120,128,.36);
    --green:#30D158;--red:#FF453A;--blue:#0A84FF;--orange:#FF9F0A;
    --g1:#30D158;--g2:#0A84FF;--g3:#FF9F0A;--g4:#FF453A;
    --blur-bg:rgba(24,24,26,.78);--shadow:0 0 0 .5px rgba(255,255,255,.04);
  }
}

/* ---- ۱.۲ پایه | 1.2 Base Reset ---- */
/* بازنشانی پایه | Base Reset: یکسان‌سازی ظاهر دکمه‌ها و نوشته‌ها در سافاری و حذف رفتارهای مزاحم لمسی */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px*var(--tf));-webkit-text-size-adjust:100%;height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--label);font-family:var(--font);font-size:1.0625rem;line-height:1.55;-webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:inherit;user-select:none;-webkit-user-select:none}
input,textarea,select{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;border:0;background:none;outline:0;margin:0;border-radius:0}
a{color:var(--tint);text-decoration:none}
h1,h2,h3,h4,p{margin:0}
bdi{unicode-bidi:isolate}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.nosel{user-select:none;-webkit-user-select:none}
.selectable{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}

/* ---- ۱.۳ قاب برنامه | 1.3 App Shell ---- */
/* قاب برنامه | App Frame: کل صفحهٔ گوشی؛ هر «صفحه» یک لایهٔ جدا با نوار بالا و ناحیهٔ اسکرول خودش است */
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#stage{position:absolute;inset:0;overflow:hidden}
.page{position:absolute;inset:0;background:var(--bg);overflow:hidden}
.page.anim-fwd-in{animation:pgInFwd .46s var(--ease) both;z-index:3;box-shadow:0 0 40px rgba(0,0,0,.18)}
.page.anim-fwd-out{animation:pgOutFwd .46s var(--ease) both;z-index:1;pointer-events:none}
.page.anim-back-in{animation:pgInBack .46s var(--ease) both;z-index:1}
.page.anim-back-out{animation:pgOutBack .46s var(--ease) both;z-index:3;pointer-events:none;box-shadow:0 0 40px rgba(0,0,0,.18)}
.page.anim-fade-in{animation:pgFade .2s ease-out both}
@keyframes pgInFwd{from{transform:translateX(100%)}to{transform:none}}
@keyframes pgOutFwd{from{transform:none}to{transform:translateX(-28%);opacity:.6}}
@keyframes pgInBack{from{transform:translateX(-28%);opacity:.6}to{transform:none;opacity:1}}
@keyframes pgOutBack{from{transform:none}to{transform:translateX(100%)}}
@keyframes pgFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.page[class*=anim-]{animation-duration:.01s!important}}

/* ناحیهٔ اسکرول | Scroll Area: محتوای هر صفحه؛ بالا جا برای نوار عنوان و پایین جا برای نوار تب‌ها گذاشته شده */
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-top:calc(var(--sat) + var(--nav-h));padding-bottom:calc(var(--sab) + 28px)}
.page.has-tabs .scroll{padding-bottom:calc(var(--tab-h) + var(--sab) + 28px)}
.large-title{font-size:2.125rem;font-weight:800;line-height:1.35;padding:2px 20px 10px;letter-spacing:-.2px}
.page-sub{padding:0 20px 12px;color:var(--label-2);font-size:.9375rem;margin-top:-6px}

/* ---- ۱.۴ نوار عنوان | 1.4 Navigation Bar ---- */
/* نوار عنوان بالا | Navigation Bar: شیشه‌ای و محو؛ وقتی صفحه کمی اسکرول شود عنوان کوچک وسط نوار پیدا می‌شود (مثل iOS) */
.nav{position:absolute;top:0;inset-inline:0;z-index:20;padding-top:var(--sat);pointer-events:none}
.nav-bg{position:absolute;inset:0;background:var(--blur-bg);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);opacity:0;transition:opacity .18s;border-bottom:.5px solid var(--sep)}
.nav.solid .nav-bg{opacity:1}
.nav-row{position:relative;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding-inline:6px;pointer-events:auto}
.nav-title{position:absolute;inset-inline:84px;text-align:center;font-weight:700;font-size:1.0625rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .15s;pointer-events:none}
.nav.solid .nav-title{opacity:1}
.nav-side{display:flex;align-items:center;gap:2px;min-width:44px}
.nav-btn{min-height:44px;min-width:44px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:3px;color:var(--tint);font-size:1.0625rem;border-radius:12px;transition:opacity .15s}
.nav-btn:active{opacity:.35}
.nav-btn.bold{font-weight:700}
.nav-btn svg{width:22px;height:22px}
.nav-back{padding-inline-start:2px}
.nav-back svg{width:24px;height:24px}
.nav-back span{max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- ۱.۵ نوار تب‌ها | 1.5 Tab Bar ---- */
/* نوار تب پایین | Tab Bar: پنج تب اصلی دوره (حضور و غیاب، چک‌لیست، برنامه، دانش‌آموزان، بیشتر)؛ روی دوره‌ها و تنظیمات پنهان می‌شود */
#tabbar{position:absolute;inset-inline:0;bottom:0;z-index:30;height:calc(var(--tab-h) + var(--sab));padding-bottom:var(--sab);display:flex;background:var(--blur-bg);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid var(--sep);transition:transform .38s var(--ease)}
#tabbar.hidden{transform:translateY(110%)}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--label-2);font-size:.6875rem;font-weight:600;padding-top:2px;transition:color .15s}
.tab svg{width:26px;height:26px;stroke-width:1.7}
.tab.on{color:var(--tint)}
.tab:active{opacity:.5}
.tab .tb-badge{position:absolute;top:2px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:.6875rem;line-height:16px;text-align:center;padding:0 4px}

/* دکمهٔ برگشت کپسولی | Round Back Capsule: دکمهٔ برگشت داخل یک کپسول گرد */
.nav-back{background:var(--fill);border-radius:999px;min-height:36px;min-width:44px;padding:0 12px}


/* ---- ۲.۱ فهرست‌ها | 2.1 Lists ---- */
/* گروه فهرست | Inset Group: جعبهٔ سفید گوشه‌گرد مثل «تنظیمات» آیفون؛ هر ردیف با خط جداکنندهٔ ظریف */
.group{margin:0 16px 22px;background:var(--card);border-radius:13px;overflow:hidden}
.group-h{padding:0 32px 7px;color:var(--label-2);font-size:.8125rem;font-weight:600}
.group-f{padding:7px 32px 0;margin-top:-14px;margin-bottom:22px;color:var(--label-2);font-size:.8125rem;line-height:1.7}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:9px 16px;width:100%;text-align:start;background:var(--card)}
.row+.row::before{content:"";position:absolute;top:0;inset-inline-start:16px;inset-inline-end:0;height:.5px;background:var(--sep)}
.row.has-lead+.row.has-lead::before{inset-inline-start:68px}
.row.tap{transition:background .12s}
.row.tap:active{background:var(--fill)}
.row .lead{flex:none;display:flex;align-items:center;justify-content:center}
.row .main{flex:1;min-width:0}
.row .ttl{font-size:1.0625rem;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ttl.wrap{white-space:normal}
.row .sub{color:var(--label-2);font-size:.875rem;line-height:1.55;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub.wrap{white-space:normal}
.row .trail{flex:none;display:flex;align-items:center;gap:8px;color:var(--label-2);font-size:1rem}
.row .chev{flex:none;width:14px;height:14px;color:var(--label-3);stroke-width:2.6}
.row.kv .ttl{color:var(--label-2);flex:0 0 36%;font-size:.9375rem}
.row.kv .val{flex:1;min-width:0;text-align:start;word-break:break-word;line-height:1.7}
.row.kv{align-items:flex-start;padding-block:11px}
.row.kv .ttl{padding-top:1px}
.row.static{cursor:default}
.ic-sq{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.ic-sq svg{width:19px;height:19px;stroke-width:2}

/* ---- ۲.۲ کارت‌ها | 2.2 Cards ---- */
/* کارت | Card: یک جعبهٔ سفید برای نمایش چند چیز کنار هم (مثل آمار یا خلاصه) */
.card{margin:0 16px 18px;background:var(--card);border-radius:16px;padding:14px 16px}
.card.flush{padding:0;overflow:hidden}
.card h3{font-size:1.0625rem;font-weight:700;margin-bottom:8px}
.pad-x{padding-inline:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb12{margin-bottom:12px}
.center{text-align:center}
.muted{color:var(--label-2)}
.tiny{font-size:.8125rem}
.small{font-size:.9375rem}
.bold{font-weight:700}
.tint{color:var(--tint)}
.green{color:var(--green)}.red{color:var(--red)}.orange{color:var(--orange)}.blue{color:var(--blue)}
.grow{flex:1;min-width:0}
.spacer{height:12px}

/* ---- ۲.۳ دکمه‌ها | 2.3 Buttons ---- */
/* دکمه‌ها | Buttons: دکمهٔ اصلی (قرمز پر)، کم‌رنگ، ساده و خطرناک؛ با لمس کمی کوچک می‌شوند */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:0 20px;border-radius:14px;font-size:1.0625rem;font-weight:700;text-align:center;transition:transform .12s,opacity .12s,background .15s}
.btn:active{transform:scale(.975);opacity:.82}
.btn.primary{background:var(--tint);color:#fff}
.btn.tinted{background:var(--tint-weak);color:var(--tint)}
.btn.gray{background:var(--fill);color:var(--label)}
.btn.danger{background:rgba(255,59,48,.12);color:var(--red)}
.btn.plain{color:var(--tint);min-height:44px}
.btn.sm{min-height:36px;padding:0 14px;border-radius:18px;font-size:.9375rem;width:auto}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:20px;height:20px}
.btn .spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- ۲.۴ ورودی‌ها | 2.4 Inputs ---- */
/* ردیف ورودی | Field Row: برچسب و جای نوشتن در یک ردیف مثل فرم ورود iOS */
.field{display:flex;align-items:center;gap:10px;min-height:54px;padding:6px 16px;background:var(--card)}
.field+.field{border-top:.5px solid var(--sep)}
.field label{flex:0 0 86px;font-size:1rem;font-weight:600}
.field input{flex:1;min-width:0;font-size:1.0625rem;height:44px}
.field input::placeholder{color:var(--label-3)}
.field .eye{flex:none;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--label-2);border-radius:10px}
.field .eye svg{width:22px;height:22px}
/* جستجو | Search Field: نوار جستجوی گرد و خاکستری مثل iOS */
.search{position:relative;margin:0 16px 12px}
.search input{width:100%;height:38px;border-radius:11px;background:var(--fill);padding-inline:36px 12px;font-size:1.0625rem}
.search input::placeholder{color:var(--label-2)}
.search svg{position:absolute;top:50%;inset-inline-start:11px;transform:translateY(-50%);width:18px;height:18px;color:var(--label-2)}
.search .clr{position:absolute;top:50%;inset-inline-end:8px;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--label-3);color:var(--card);display:none;align-items:center;justify-content:center}
.search .clr svg{position:static;transform:none;width:12px;height:12px;color:var(--card);stroke-width:3}
.search.has .clr{display:flex}

/* ---- ۲.۵ انتخاب‌گر قطعه‌ای | 2.5 Segmented Control ---- */
/* انتخاب‌گر قطعه‌ای | Segmented Control: چند گزینهٔ کنار هم که یکی روشن است (مثل روزانه/هفتگی/ماهانه) */
.seg{display:flex;margin:0 16px 14px;padding:2px;border-radius:9px;background:var(--fill);gap:2px}
.seg button{flex:1;min-width:0;min-height:32px;padding:3px 6px;border-radius:7px;font-size:.9375rem;font-weight:600;text-align:center;color:var(--label);transition:background .2s,box-shadow .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04)}
:root[data-theme=dark] .seg button.on{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .seg button.on{background:#636366}}
/* نوار چیپ‌ها | Chip Scroller: ردیف افقی قابل کشیدن (مثل انتخاب درس) */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:34px;padding:0 15px;border-radius:17px;background:var(--card);color:var(--label);font-size:.9375rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.chip.on{background:var(--tint);color:#fff}
.chip:active{opacity:.7}

/* ---- ۲.۶ نشان‌ها | 2.6 Badges & Pills ---- */
/* نشان و قرص | Badge & Pill: برچسب‌های کوچک رنگی (حاضر، غایب، شمارنده‌ها) */
.pill{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:0 10px;border-radius:12px;font-size:.8125rem;font-weight:700;background:var(--fill);color:var(--label-2);white-space:nowrap}
.pill.green{background:rgba(52,199,89,.16);color:#1f9d45}
.pill.red{background:rgba(255,59,48,.14);color:#e0281d}
.pill.orange{background:rgba(255,149,0,.16);color:#c76e00}
.pill.blue{background:rgba(0,122,255,.13);color:#0a6ad6}
.pill.tint{background:var(--tint-weak);color:var(--tint)}
:root[data-theme=dark] .pill.green{color:#4cd964}:root[data-theme=dark] .pill.red{color:#ff6b61}:root[data-theme=dark] .pill.orange{color:#ffb340}:root[data-theme=dark] .pill.blue{color:#64a8ff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .pill.green{color:#4cd964}:root:not([data-theme=light]) .pill.red{color:#ff6b61}:root:not([data-theme=light]) .pill.orange{color:#ffb340}:root:not([data-theme=light]) .pill.blue{color:#64a8ff}}
.tag{display:inline-block;padding:0 8px;margin:2px 0 0 4px;border-radius:8px;background:var(--fill);color:var(--label-2);font-size:.75rem;line-height:1.7}
.count-dot{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:11px;padding:0 6px;font-size:.8125rem;font-weight:700;background:var(--fill);color:var(--label-2)}
.count-dot.red{background:rgba(255,59,48,.14);color:var(--red)}
.count-dot.green{background:rgba(52,199,89,.16);color:#1f9d45}

/* ---- ۲.۷ آواتار | 2.7 Avatars ---- */
/* آواتار | Avatar: عکس دانش‌آموز یا دایرهٔ رنگی با حرف اول نام (پسر آبی، دختر صورتی، بدون جنسیت خاکستری) */
.av{position:relative;flex:none;width:var(--s,40px);height:var(--s,40px);border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:calc(var(--s,40px)*.38);background:linear-gradient(160deg,var(--a1,#9aa0a6),var(--a2,#7d838a));line-height:1}
.av.girl{--a1:#f9a8c9;--a2:#e0689d}
.av.boy{--a1:#8ec5ff;--a2:#3d8bea}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.av.has img{opacity:1}
.av.sq{border-radius:22%}
.av.course{--a1:#fb7185;--a2:#e11d48}
.av.lesson{--a1:#fbbf24;--a2:#f59e0b}
.av svg{width:55%;height:55%;stroke-width:1.8}

/* ---- ۲.۸ آمار | 2.8 Stat Tiles ---- */
/* کاشی آمار | Stat Tiles: عددهای مهم کنار هم (مثلاً حاضر / غایب / ثبت‌نشده) */
.stats{display:flex;gap:10px;margin:0 16px 16px}
.stat{flex:1;min-width:0;background:var(--card);border-radius:14px;padding:11px 8px 9px;text-align:center}
.stat b{display:block;font-size:1.5rem;font-weight:800;line-height:1.35}
.stat span{display:block;font-size:.8125rem;color:var(--label-2);font-weight:600}
.stat.green b{color:var(--green)}.stat.red b{color:var(--red)}.stat.orange b{color:var(--orange)}.stat.tint b{color:var(--tint)}
button.stat:active{opacity:.6}

/* ---- ۲.۹ نمره‌ها | 2.9 Grade Pills ---- */
/* قرص نمره | Grade Pill: خیلی خوب سبز، خوب آبی، قابل قبول نارنجی، نیاز به تلاش قرمز؛ نمرهٔ ۰ تا ۲۰ هم با همین رنگ‌ها */
.gp{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:30px;padding:0 7px;border-radius:9px;font-size:.8125rem;font-weight:800;color:#fff;background:var(--fill-2);white-space:nowrap;line-height:1}
.gp.g1{background:var(--g1)}.gp.g2{background:var(--g2)}.gp.g3{background:var(--g3)}.gp.g4{background:var(--g4)}
.gp.abs{background:rgba(255,59,48,.13);color:var(--red);font-weight:700}
.gp.none{background:var(--fill);color:var(--label-3);font-weight:500}
.gp.q{min-width:44px;font-size:.875rem}
.gp.sm{min-width:30px;height:26px;font-size:.75rem;padding:0 5px;border-radius:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 14px;justify-content:center}
.legend .lg{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;color:var(--label-2);font-weight:600}
.legend .lg i{width:11px;height:11px;border-radius:4px;display:inline-block}

/* ---- ۲.۱۰ پنجرهٔ پایین | 2.10 Sheets ---- */
/* پنجرهٔ پایین‌آمده | Bottom Sheet: برگهٔ جزئیات که از پایین بالا می‌آید و با کشیدن یا لمس پس‌زمینه بسته می‌شود */
#overlay{position:fixed;inset:0;z-index:100;pointer-events:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .3s;pointer-events:auto}
.backdrop.on{opacity:1}
.sheet{position:absolute;inset-inline:0;bottom:0;max-height:88%;display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .45s var(--ease);pointer-events:auto;box-shadow:0 -8px 40px rgba(0,0,0,.2);padding-bottom:var(--sab)}
.sheet.on{transform:none}
.sheet.dragging{transition:none;will-change:transform}
.sheet{touch-action:pan-y}
.sheet .grab{flex:none;padding:8px 0 4px;touch-action:none}
.sheet .grab i{display:block;width:38px;height:5px;border-radius:3px;background:var(--label-3);margin:0 auto}
.sheet .sh-head{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:4px 16px 10px;touch-action:none}
.sheet .sh-head h3{font-size:1.1875rem;font-weight:800;text-align:center;white-space:nowrap}
.sheet .sh-head .nav-btn{justify-self:end}
.sh-act{display:flex;gap:6px;justify-self:start;min-width:0}
.sheet .sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:18px}
/* برگهٔ عملیات | Action Sheet: دکمه‌های انتخاب پایین صفحه (مثل خروج از حساب) */
.asheet{position:absolute;inset-inline:10px;bottom:calc(10px + var(--sab));transform:translateY(120%);transition:transform .4s var(--ease);pointer-events:auto}
.asheet.on{transform:none}
.asheet .box{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:8px}
.asheet .msg{padding:14px 16px;text-align:center;color:var(--label-2);font-size:.875rem;line-height:1.7}
.asheet button{display:block;width:100%;min-height:56px;font-size:1.125rem;text-align:center;border-top:.5px solid var(--sep);color:var(--tint)}
.asheet .box button:first-child{border-top:0}
.asheet button.destructive{color:var(--red)}
.asheet button.cancel{background:var(--card);border-radius:14px;font-weight:700;color:var(--tint)}
/* پیام کوتاه | Toast: پیام گذرا بالای صفحه */
.toast{position:absolute;top:calc(var(--sat) + 10px);left:50%;transform:translate(-50%,-140%);max-width:calc(100% - 40px);padding:11px 18px;border-radius:22px;background:rgba(40,40,44,.94);color:#fff;font-size:.9375rem;font-weight:600;text-align:center;line-height:1.5;transition:transform .45s var(--ease);box-shadow:0 8px 30px rgba(0,0,0,.28);pointer-events:none}
.toast.on{transform:translate(-50%,0)}
.toast.err{background:rgba(200,30,30,.95)}

/* ---- ۲.۱۱ حالت خالی | 2.11 Empty State ---- */
/* حالت خالی | Empty State: وقتی چیزی برای نمایش نیست، آیکن و جملهٔ کوتاه */
.empty{padding:46px 32px;text-align:center;color:var(--label-2)}
.empty svg{width:52px;height:52px;color:var(--label-3);stroke-width:1.4;margin-bottom:10px}
.empty b{display:block;color:var(--label);font-size:1.125rem;margin-bottom:4px}
.empty p{font-size:.9375rem;line-height:1.8}
.banner{margin:0 16px 14px;padding:11px 14px;border-radius:13px;background:var(--tint-weak);color:var(--tint-2);font-size:.875rem;line-height:1.7;display:flex;gap:10px;align-items:flex-start}
:root[data-theme=dark] .banner{color:var(--tint)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .banner{color:var(--tint)}}
.banner svg{flex:none;width:20px;height:20px;margin-top:2px}
.banner.info{background:rgba(0,122,255,.1);color:#0a6ad6}

/* ---- کیبورد و لمس | Keyboard & Touch: برگه بالای کیبورد می‌نشیند؛ دوبار لمس بزرگ‌نمایی نمی‌کند؛ اندازهٔ متن خودکار نمی‌شود ---- */
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.sheet{margin-bottom:var(--kb,0px);max-height:min(88%,calc(100% - var(--kb,0px) - var(--sat) - 12px))}


/* ================================================================
   ۳) ظاهر صفحه‌ها | 3) Screen Styles
   ظاهر مخصوص هر صفحه (ورود، بارگذاری، دوره‌ها، حضور و غیاب، چک‌لیست، برنامه، دانش‌آموزان، بیشتر).
   رنگ‌ها و اجزای مشترک در بخش ۱ و ۲ هستند.
   ================================================================ */

/* ---- ۳.۱ پیش‌نمایش روی کامپیوتر | 3.1 Desktop Preview ---- */
/* قاب گوشی روی صفحهٔ بزرگ | Phone Frame On Desktop: اگر برنامه روی کامپیوتر باز شود، به‌جای کشیده‌شدن در یک ستون به عرض آیفون ۱۳ پرو مکس می‌ماند */
@media (min-width:700px){
  html{background:#d6d6dc}
  #app{inset:0 auto;left:50%;width:428px;transform:translateX(-50%);box-shadow:0 0 0 1px rgba(0,0,0,.08),0 20px 80px rgba(0,0,0,.25)}
}

/* ---- ۳.۲ صفحهٔ بارگذاری | 3.2 Loading Screen ---- */
/* صفحهٔ بارگذاری | Splash: توت‌فرنگی پیکسلی، نوار پیشرفت و پیام وضعیت؛ موقع گرفتن اطلاعات از سرور دیده می‌شود */
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 36px;background:linear-gradient(180deg,#fff7ed 0%,var(--bg) 60%)}
:root[data-theme=dark] .splash{background:linear-gradient(180deg,#2a0f16 0%,#000 65%)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .splash{background:linear-gradient(180deg,#2a0f16 0%,#000 65%)}}
.splash .logo{width:116px;height:116px;animation:float 2.6s ease-in-out infinite;filter:drop-shadow(0 12px 18px rgba(225,29,72,.28))}
.splash .logo svg{width:100%;height:100%;display:block}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.splash h2{margin-top:20px;font-size:1.75rem;font-weight:800}
.splash .sub{margin-top:2px;color:var(--label-2);font-size:.9375rem}
.prog{width:min(260px,70%);height:6px;border-radius:3px;background:var(--fill-2);margin-top:30px;overflow:hidden}
.prog i{display:block;height:100%;width:6%;border-radius:3px;background:var(--tint);transition:width .5s var(--ease)}
.splash .msg{margin-top:12px;color:var(--label-2);font-size:.9375rem;min-height:24px;text-align:center}
.splash .errbox{margin-top:22px;width:100%;display:flex;flex-direction:column;gap:10px}
.splash .errbox .banner{margin:0}

/* ---- ۳.۳ صفحهٔ ورود | 3.3 Login Screen ---- */
/* صفحهٔ ورود | Login: لوگو، دو فیلد ایمیل و رمز، دکمهٔ ورود و دکمهٔ ورود با دادهٔ نمایشی */
.login .scroll{padding-top:calc(var(--sat) + 34px)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px 26px}
.hero .logo{width:96px;height:96px;filter:drop-shadow(0 10px 16px rgba(225,29,72,.25))}
.hero .logo svg{width:100%;height:100%;display:block}
.hero h1{margin-top:14px;font-size:2rem;font-weight:800;line-height:1.4}
.hero p{margin-top:2px;color:var(--label-2);font-size:.9375rem}
.field input.ltr-in{direction:ltr;text-align:right}
.field input.ltr-in::placeholder{text-align:right}
.login .group{margin-bottom:14px}
.or{display:flex;align-items:center;gap:12px;margin:18px 28px;color:var(--label-3);font-size:.8125rem}
.or::before,.or::after{content:"";flex:1;height:.5px;background:var(--sep)}
.foot-note{padding:16px 36px 0;text-align:center;color:var(--label-2);font-size:.8125rem;line-height:1.9}
.login .btn+.btn{margin-top:10px}

/* ---- ۳.۴ دوره‌ها | 3.4 Course List ---- */
/* فهرست دوره‌ها | Courses: کارت‌های رنگی دوره با نام، پایه و تعداد دانش‌آموز؛ دکمهٔ حساب بالای صفحه */
.acc{width:32px;height:32px;border-radius:50%;background:linear-gradient(160deg,#fb7185,#e11d48);color:#fff;font-weight:800;font-size:.9375rem;display:flex;align-items:center;justify-content:center;line-height:1}
.ccard{display:flex;align-items:center;gap:14px;width:100%;padding:14px 14px;background:var(--card);border-radius:18px;text-align:start;margin-bottom:12px;box-shadow:var(--shadow);transition:transform .12s}
.ccard:active{transform:scale(.985)}
.ccard .cmain{flex:1;min-width:0}
.ccard .cname{font-size:1.1875rem;font-weight:800;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard .csub{color:var(--label-2);font-size:.875rem;line-height:1.6}
.ccard .cmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ccard .chev{width:15px;height:15px;color:var(--label-3);stroke-width:2.6;flex:none}
.clist{padding:0 16px}
.foot-time{padding:6px 24px 0;text-align:center;color:var(--label-3);font-size:.8125rem}

/* ---- ۳.۵ نوار روزها | 3.5 Day Strip ---- */
/* نوار روزهای هفته | Day Strip: پنج روز مدرسه (شنبه تا چهارشنبه) با فلش هفتهٔ قبل و بعد؛ نقطهٔ زیر روز یعنی برای آن روز چیزی ثبت شده */
.dwrap{display:flex;align-items:center;gap:2px;margin:0 8px 12px}
.dnav{flex:none;width:32px;height:50px;display:flex;align-items:center;justify-content:center;color:var(--tint);border-radius:12px}
.dnav:active{opacity:.4}
.dnav svg{width:22px;height:22px}
.dnav[disabled]{opacity:.25;pointer-events:none}
.dstrip{flex:1;display:flex;gap:4px}
.dcell{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0 9px;border-radius:14px;transition:background .2s,color .2s}
.dcell small{font-size:.75rem;color:var(--label-2);font-weight:700;line-height:1.5}
.dcell b{font-size:1.1875rem;font-weight:800;line-height:1.4}
.dcell.today b{color:var(--tint)}
.dcell.on{background:var(--tint)}
.dcell.on small,.dcell.on b{color:#fff}
.dcell .dot{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--label-3)}
.dcell.on .dot{background:rgba(255,255,255,.85)}
.dcell.dis{opacity:.35;pointer-events:none}
.day-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 20px 10px}
.day-head b{font-size:1.0625rem}

/* ---- ۳.۶ حضور و غیاب | 3.6 Attendance ---- */
/* حضور و غیاب | Attendance: ردیف دانش‌آموز با وضعیت رنگی و نقطه‌های ماه */
.dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.dt{width:9px;height:9px;border-radius:3px;background:var(--label-4)}
.dt.p{background:var(--green)}
.dt.a{background:var(--red)}
.dt.f{background:transparent;box-shadow:inset 0 0 0 1px var(--label-4)}
.mo-nav{display:flex;align-items:center;justify-content:space-between;margin:0 8px 10px}
.mo-nav .t{font-size:1.125rem;font-weight:800}
.num-lg{font-weight:800;font-variant-numeric:tabular-nums}

/* ---- ۳.۷ چک‌لیست | 3.7 Checklist ---- */
/* چک‌لیست | Checklist: نوار موردها، خلاصهٔ نمره‌ها و تاریخچهٔ هر مورد */
.chips .chip .cl{display:block;max-width:62vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist{display:flex;gap:4px;align-items:center;flex-wrap:nowrap;direction:ltr}
.hist .gp{flex:none}
.qline{font-size:.8125rem;color:var(--label-2);line-height:1.7;margin-top:2px;white-space:normal}
.qline.neg{color:var(--red)}
.qline.pos{color:#1f9d45}
.les-h{display:flex;align-items:center;gap:10px;padding:0 24px 8px;font-weight:800;font-size:1.0625rem}
.les-h .av{--s:28px}
.kvrow{display:flex;align-items:flex-start;gap:10px;padding:11px 16px;background:var(--card)}
.kvrow+.kvrow{border-top:.5px solid var(--sep)}
.kvrow .d{flex:0 0 96px;color:var(--label-2);font-size:.875rem;padding-top:2px}
.kvrow .v{flex:1;min-width:0;line-height:1.7;word-break:break-word}

/* ---- ۳.۸ برنامهٔ درسی | 3.8 Schedule ---- */
/* برنامهٔ روز و هفته | Schedule: زنگ‌های روز با ساعت و درس، و جدول هفتگی رنگی */
.per{position:relative;display:flex;align-items:stretch;gap:12px;padding:11px 16px;min-height:66px;background:var(--card);width:100%;text-align:start}
.per+.per::before{content:"";position:absolute;top:0;inset-inline-start:16px;inset-inline-end:0;height:.5px;background:var(--sep)}
.per .tm{flex:0 0 56px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:.8125rem;color:var(--label-2);line-height:1.5;font-variant-numeric:tabular-nums}
.per .tm b{color:var(--label);font-size:.9375rem}
.per .bar{flex:none;width:4px;border-radius:2px;background:var(--c,var(--label-4))}
.per .nm{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.per .nm b{font-size:1.0625rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.per .nm span{font-size:.8125rem;color:var(--label-2)}
.per.cur{background:var(--tint-weak)}
.per.cur .tm b{color:var(--tint)}
.per.brk{min-height:38px;padding-block:6px;background:var(--card-2)}
.per.brk .nm b{font-size:.9375rem;font-weight:600;color:var(--label-2)}
.per.brk .bar{background:var(--label-4)}
.per.none .nm b{color:var(--label-3);font-weight:500}
.wkw{margin:0 12px 18px;padding:6px;background:var(--card);border-radius:16px}
.wk{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed}
.wk th{font-size:.75rem;color:var(--label-2);font-weight:700;padding:5px 0}
.wk th.pn{width:30px}
.wk td{height:60px;border-radius:11px;font-size:.75rem;font-weight:700;text-align:center;padding:3px 2px;line-height:1.4;color:#fff;background:linear-gradient(160deg,var(--a1),var(--a2));word-break:break-word}
.wk td.e{background:var(--fill);color:var(--label-3);font-weight:500}
.wk td.cur{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--tint)}
.wk th.tdy{color:var(--tint)}
.wk .pn{font-size:.75rem;color:var(--label-2)}

/* ---- ۳.۹ دانش‌آموزان | 3.9 Students ---- */
/* دانش‌آموزان | Students: سرصفحهٔ پروفایل، دکمه‌های تماس گرد و جدول کارنامه */
.shead{display:flex;flex-direction:column;align-items:center;text-align:center;padding:2px 20px 16px}
.shead .nm{font-size:1.375rem;font-weight:800;margin-top:10px;line-height:1.5}
.shead .meta{color:var(--label-2);font-size:.9375rem}
.shead .tags{margin-top:4px}
.circ{display:flex;gap:18px;margin-top:14px}
.circ a{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--tint);font-size:.75rem;font-weight:700}
.circ a i{width:50px;height:50px;border-radius:50%;background:var(--tint-weak);display:flex;align-items:center;justify-content:center}
.circ a i svg{width:22px;height:22px}
.circ a:active{opacity:.5}
.tblw{margin:0 16px 18px;background:var(--card);border-radius:16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{border-collapse:separate;border-spacing:0;min-width:100%}
.tbl th,.tbl td{padding:8px 5px;text-align:center;font-size:.8125rem;white-space:nowrap;border-bottom:.5px solid var(--sep)}
.tbl th{color:var(--label-2);font-weight:700;background:var(--card-2)}
.tbl .nm{position:sticky;inset-inline-start:0;z-index:1;background:var(--card);text-align:start;font-weight:700;padding-inline:12px;min-width:96px;max-width:118px;overflow:hidden;text-overflow:ellipsis;border-inline-end:.5px solid var(--sep)}
.tbl th.nm{background:var(--card-2)}
.tbl tr:last-child td,.tbl tr:last-child th{border-bottom:0}
.tbl tr.sum td,.tbl tr.sum th{background:var(--card-2)}
.sec-sub{padding:0 20px 8px;color:var(--label-2);font-size:.8125rem;line-height:1.8}
.mini-tl{padding:2px 0}

/* ---- ۳.۱۰ بیشتر | 3.10 More ---- */
/* صفحهٔ بیشتر و زیرصفحه‌ها | More: کارت دوره، ردیف‌های رنگی تنظیمات، جدول بودجه‌بندی و طرح درس */
.cc{display:flex;align-items:center;gap:14px;margin:0 16px 22px;padding:14px;background:var(--card);border-radius:18px}
.cc .t1{font-size:1.1875rem;font-weight:800;line-height:1.5}
.cc .t2{color:var(--label-2);font-size:.875rem;line-height:1.6}
.bud td,.bud th{font-size:.8125rem}
.plan-sec{padding:12px 16px;background:var(--card)}
.plan-sec+.plan-sec{border-top:.5px solid var(--sep)}
.plan-sec h4{font-size:.8125rem;color:var(--tint);font-weight:800;margin-bottom:2px}
.plan-sec p{font-size:.9688rem;line-height:1.9;white-space:pre-wrap;word-break:break-word}
.ver{padding:22px;text-align:center;color:var(--label-3);font-size:.8125rem;line-height:1.9}
.help-list{padding:0 20px 8px;color:var(--label-2);font-size:.875rem;line-height:2}
.help-list li{margin-bottom:2px}

/* ---- ۳.۱۱ افزودنی‌های کوچک | 3.11 Small Additions ---- */
/* کاشی انتخاب‌شده و خانهٔ جاری | Active Tile & Current Cell: کاشی فیلتر فعال در حضور و غیاب و خانهٔ نیمهٔ جاری در جدول بودجه‌بندی */
.stat.on{box-shadow:inset 0 0 0 2px var(--tint)}
.tbl td.cur{background:var(--tint-weak);font-weight:800;color:var(--tint)}
/* فلش ردیف زنگ | Period Chevron: اندازهٔ فلش داخل ردیف‌های برنامه (ردیف‌های معمولی خودشان اندازه دارند) */
.per .chev{flex:none;align-self:center;width:14px;height:14px;color:var(--label-3);stroke-width:2.6}
/* اصلاحات کوچک | Small Fixes: علامت + و − کنار عدد درست خوانده شود، و عنوان لینک‌ها رنگ متن عادی داشته باشد */
.count-dot{direction:ltr}
a.row{color:inherit}


/* ---- ۳.۱۲ نوار بالای دوره | 3.12 Course Top Bar ---- */
/* نوار شیفت و زنگ | Bell Bar: بالای همهٔ صفحه‌های دوره؛ بقیهٔ صفحه‌ها زیر آن شروع می‌شوند و دیگر خودشان به لبهٔ بالای گوشی تکیه نمی‌کنند */
:root{--bb-h:42px}
#bellbar{display:none;position:absolute;top:0;inset-inline:0;z-index:40;height:calc(var(--sat) + var(--bb-h));padding-top:var(--sat);background:var(--blur-bg);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-bottom:.5px solid var(--sep)}
#app.course #bellbar{display:block}
#app.course #stage{top:calc(var(--sat) + var(--bb-h));--sat:0px}
.bb-in{display:flex;align-items:center;gap:6px;height:var(--bb-h);padding-inline:12px 6px}
.bb-main{flex:1;min-width:0;display:flex;align-items:center;gap:9px;height:100%;text-align:start}
.bb-main:active{opacity:.6}
.bb-sh{flex:none;display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:12px;background:var(--tint-weak);color:var(--tint);font-size:.75rem;font-weight:800;white-space:nowrap}
.bb-sh:empty{display:none}
.bb-sh svg{width:13px;height:13px}
.bb-name{flex:1;min-width:0;font-size:.9375rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb-name small{color:var(--label-2);font-weight:600;font-size:.8125rem}
.bb-left{flex:none;font-variant-numeric:tabular-nums;font-weight:800;font-size:.9375rem;color:var(--tint);white-space:nowrap;display:inline-flex;align-items:baseline;gap:5px}
.bb-left small{font-size:.6875rem;font-weight:600;color:var(--label-2)}
.bb-left:empty{display:none}
.bb-prog{position:absolute;bottom:-.5px;inset-inline-start:0;height:2px;width:0;background:var(--tint);transition:width 1s linear;border-radius:0 2px 2px 0}
.bb-sync{flex:none;position:relative;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--label-2)}
.bb-sync svg{width:21px;height:21px}
.bb-sync:active{opacity:.5}
.bb-sync .sd{position:absolute;top:6px;inset-inline-end:5px;width:9px;height:9px;border-radius:50%;background:var(--green);border:1.5px solid var(--bg)}
.bb-sync.wait .sd,.bb-sync.saving .sd{background:var(--orange)}
.bb-sync.saving svg{animation:bbPulse 1s ease-in-out infinite}
.bb-sync.offline .sd{background:var(--gray)}
.bb-sync.err .sd,.bb-sync.login .sd{background:var(--red)}
.bb-sync.demo .sd{background:var(--blue)}
@keyframes bbPulse{50%{opacity:.35}}

/* ---- ۳.۱۳ کنترل‌های ثبت | 3.13 Entry Controls ---- */
/* ثبت حضور | Attendance Buttons: دو دکمهٔ گرد حاضر و غایب کنار هر دانش‌آموز */
.arow .main.tap,.crow .main.tap{cursor:pointer}
.abtns{gap:10px!important}
.abt{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .12s,background .15s,color .15s}
.abt svg{width:20px;height:20px;stroke-width:3}
.abt:active{transform:scale(.88)}
.abt.p{background:rgba(52,199,89,.14);color:var(--green)}.abt.a{background:rgba(255,59,48,.12);color:var(--red)}
.abt.p.on{background:var(--green);color:#fff}.abt.a.on{background:var(--red);color:#fff}
.abt[disabled],.gb[disabled],.cb[disabled],.qin[disabled]{opacity:.4;pointer-events:none}
.tools2{display:flex;gap:10px;margin-bottom:14px}
.tools2 .btn{flex:1;width:auto}
.banner.warn{background:rgba(255,149,0,.14);color:#b45f00}
:root[data-theme=dark] .banner.warn{color:#ffb340}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .banner.warn{color:#ffb340}}
.lkd{display:inline-flex;align-items:center;gap:3px;color:var(--orange)}.lkd svg{width:12px;height:12px}
/* نمرهٔ ۱ تا ۴ | Grade Buttons: چهار دکمهٔ رنگی؛ دکمهٔ انتخاب‌شده پر می‌شود */
.gbtns{display:flex;gap:5px}
.gb{width:36px;height:38px;border-radius:11px;font-size:.8125rem;font-weight:800;transition:transform .12s,background .15s,color .15s;white-space:nowrap}
.gb:active{transform:scale(.9)}
.gb.g1{background:rgba(52,199,89,.16);color:#1f9d45}.gb.g2{background:rgba(10,132,255,.14);color:#0a6fe0}.gb.g3{background:rgba(255,159,10,.17);color:#c26e00}.gb.g4{background:rgba(255,69,58,.14);color:#e0281c}
.gb.on{color:#fff!important}.gb.g1.on{background:var(--g1)}.gb.g2.on{background:var(--g2)}.gb.g3.on{background:var(--g3)}.gb.g4.on{background:var(--g4)}
.gkey{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 14px;padding:0 16px 10px;font-size:.75rem;color:var(--label-2);font-weight:600}
.gkey i{font-style:normal;display:inline-block;min-width:26px;padding:1px 5px;border-radius:6px;color:#fff;margin-inline-end:5px;font-weight:800;text-align:center}
.gkey i.g1{background:var(--g1)}.gkey i.g2{background:var(--g2)}.gkey i.g3{background:var(--g3)}.gkey i.g4{background:var(--g4)}
/* نمرهٔ ۰ تا ۲۰ | Number Field: خانهٔ عدد؛ بعد از ثبت به رنگ نمره درمی‌آید */
.qin{width:76px;height:42px;border-radius:12px;background:var(--fill);text-align:center;font-weight:800;font-size:1.125rem;color:var(--label);border:2px solid transparent;font-family:inherit;direction:ltr}
.qin:focus{outline:none;border-color:var(--tint);background:var(--card)}
.qin.g1{background:var(--g1);color:#fff}.qin.g2{background:var(--g2);color:#fff}.qin.g3{background:var(--g3);color:#fff}.qin.g4{background:var(--g4);color:#fff}
.qin.g1:focus,.qin.g2:focus,.qin.g3:focus,.qin.g4:focus{border-color:var(--label)}
/* شایستگی و توضیح | Competency & Note Buttons */
.cbtns{display:flex;gap:8px}
.cb{min-width:42px;height:40px;padding:0 10px;border-radius:20px;background:var(--fill);color:var(--label-2);font-weight:800;font-size:.9375rem;display:inline-flex;align-items:center;justify-content:center;transition:transform .12s,background .15s}
.cb svg{width:18px;height:18px;stroke-width:3}
.cb:active{transform:scale(.9)}
.cb.pos{background:rgba(52,199,89,.14);color:var(--green)}.cb.neg{background:rgba(255,59,48,.12);color:var(--red)}
.cb.pos.on{background:var(--green);color:#fff}.cb.neg.on{background:var(--red);color:#fff}
.cb.txt.on{background:var(--tint);color:#fff}
.qline{display:block;font-size:.8125rem;line-height:1.6;color:var(--label-2);white-space:normal}
.qline.pos{color:#1f9d45}.qline.neg{color:var(--red)}
/* برگهٔ شایستگی | Competency Sheet */
.cd-sec{margin:0 16px 12px;padding:12px;border-radius:14px;background:var(--card)}
.cd-sec.pos{border-inline-start:4px solid var(--green)}.cd-sec.neg{border-inline-start:4px solid var(--red)}
.cd-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cd-h>b{font-size:1.0625rem}
.stepper{display:inline-flex;align-items:center;gap:12px}
.stepper .cn{min-width:26px;text-align:center;font-size:1.25rem;font-weight:800}
.stp{width:38px;height:38px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--label)}
.stp svg{width:18px;height:18px;stroke-width:3}.stp:active{opacity:.5}.stp[disabled]{opacity:.35;pointer-events:none}
.fld{display:block;width:100%;padding:11px 14px;margin-top:8px;border-radius:12px;background:var(--bg);border:1px solid var(--sep);font:inherit;font-size:1rem;color:var(--label);resize:none}
.fld:focus{outline:none;border-color:var(--tint)}
.cd-sec .fld:first-of-type{margin-top:4px}
.sheet .pad-x .fld{background:var(--card)}
/* ردیف‌های زنگ | Bell List Rows: زنگ جاری رنگی، زنگ‌های گذشته کم‌رنگ و تفریح‌ها کوچک‌تر */
.row.now{background:var(--tint-weak)}.row.now .ttl{color:var(--tint);font-weight:800}
.row.past{opacity:.5}
.row.brk .ttl{font-size:.9375rem;color:var(--label-2)}
.gkey .n{font-weight:800;color:var(--label);margin-inline-start:4px}
.gkey span{display:inline-flex;align-items:center;white-space:nowrap}

/* دکمهٔ چرخشی | Cycle Button: حضور و نمره با هر لمس به وضعیت بعدی می‌روند */
.abt.n{background:var(--fill);color:var(--label-3)}
.gb.one{width:58px;height:42px;border-radius:13px;font-size:.9375rem}
.gb.g0{background:var(--fill);color:var(--label-3)}
.gb.g0 svg{width:18px;height:18px}
.gb.one{display:flex;align-items:center;justify-content:center;padding:0;text-align:center;letter-spacing:0}

/* نوار قبلی و بعدی | Student Step Bar: بالای صفحهٔ دانش‌آموز؛ نام دانش‌آموز قبلی و بعدی و شمارهٔ او در فهرست */
.stepbar{display:flex;align-items:center;gap:8px;margin:8px 16px 4px}
.stepb{flex:1;min-width:0;height:44px;border-radius:14px;background:var(--card);color:var(--tint);font-weight:700;font-size:.9375rem;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 8px}
.stepb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepb svg{width:18px;height:18px;flex:none}
.stepb:active{opacity:.5}.stepb.off{opacity:.35;pointer-events:none}
.stepn{flex:none;font-size:.8125rem;color:var(--label-2);text-align:center;min-width:54px}.stepn b{color:var(--label);font-size:1rem}
.abs-pill{display:inline-flex;align-items:center;justify-content:center;min-width:58px;height:42px;padding:0 10px;border-radius:13px;background:rgba(255,59,48,.12);color:var(--red);font-weight:800;font-size:.875rem}

/* بارگذاری به‌روزرسانی | Update Loading: برگهٔ در حال دانلود */
.upd-load{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 20px 40px;text-align:center}
.upd-load svg{width:38px;height:38px;color:var(--tint);animation:bbPulse 1s ease-in-out infinite}
.upd-load span{color:var(--label-2);font-size:.875rem}
.fl-lab{display:block;margin:12px 4px 0;font-size:.8125rem;color:var(--label-2);font-weight:600}

/* بدون انتخاب و زوم | No Select No Zoom: متن در هیچ جای برنامه انتخاب نمی‌شود و صفحه زوم نمی‌شود؛ فقط داخل کادرهای نوشتن می‌شود متن را انتخاب کرد */
html,body,*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
input,textarea,select{font-size:max(16px,1rem)}
/* نام کامل روز | Full Weekday: نام کامل روزهای هفته در کپسول‌ها جا می‌شود */
.dcell small{font-size:.6875rem;white-space:nowrap;overflow:hidden;text-overflow:clip;max-width:100%}
/* شایستگی‌ها | Quick Competency Styles: دکمهٔ بالای صفحه و برگهٔ ثبت سریع */
.qc-wrap{margin:0 0 12px}
.qc-btn{min-height:44px;font-size:1rem}
.qc-btn svg{width:20px;height:20px}
.qc-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px 10px}
.qc-nav b{font-size:1.0625rem;text-align:center}
.qcr{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px}
.qcr .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qcc{display:inline-flex;align-items:center;gap:8px;flex:none}
.qcg{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:999px;background:var(--fill)}
.qcg .stp{width:32px;height:32px;background:var(--card)}
.qcg .stp svg{width:16px;height:16px}
.qv{min-width:30px;text-align:center;font-weight:800;font-size:1rem;color:var(--label-3)}
.qv.pos{color:var(--green)}.qv.neg{color:var(--red)}
.qcg{direction:ltr}
.qcg.pos{background:rgba(52,199,89,.16)}.qcg.neg{background:rgba(255,59,48,.13)}
.qc-wrap{margin-top:12px}

/* منفی‌های روز | Day Negatives Capsule: کپسول قرمز کنار دکمهٔ شایستگی‌ها */
.qc-two{display:flex;gap:8px}.qc-two .btn{flex:1;white-space:nowrap}
.qc-neg{min-height:44px;font-size:1rem;background:rgba(255,59,48,.13);color:var(--red)}
.qc-neg svg{width:20px;height:20px}.qc-neg b{background:var(--red);color:#fff;border-radius:999px;padding:0 7px;margin-inline-start:4px;font-size:.8125rem}

/* ستون‌های مثبت و منفی | Positive/Negative Columns: دو ستون کنار هم در برگهٔ «مثبت و منفی روز» */
.qc-neg b.gp{background:var(--green)}
.pn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px;direction:rtl}
.pn-col{min-width:0;border-radius:14px;padding:8px;background:var(--fill)}
.pn-col.pos{background:rgba(52,199,89,.12)}.pn-col.neg{background:rgba(255,59,48,.10)}
.pn-h{font-weight:800;text-align:center;padding:4px 0 8px}.pn-col.pos .pn-h{color:var(--green)}.pn-col.neg .pn-h{color:var(--red)}
.pn-c{background:var(--card);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.pn-n{display:flex;justify-content:space-between;gap:6px;font-weight:600}.pn-n i{font-style:normal;font-weight:800}
.pn-col.pos .pn-n i{color:var(--green)}.pn-col.neg .pn-n i{color:var(--red)}
.pn-c small{display:block;margin-top:2px;color:var(--label-3);font-size:.75rem;line-height:1.5}
.pn-0{text-align:center;color:var(--label-3);padding:12px 0}

/* انتخاب و حذف | Select & Delete: حالت انتخاب‌شدهٔ موردها و دکمهٔ «همه» */
.pn-c{position:relative;cursor:pointer}.pn-c .pn-ck{position:absolute;top:8px;inset-inline-start:8px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--label-3);display:flex;align-items:center;justify-content:center;color:transparent}
.pn-c .pn-ck svg{width:12px;height:12px}.pn-c .pn-n{padding-inline-start:26px}.pn-c small{padding-inline-start:26px}
.pn-c.sel{outline:2px solid var(--red)}.pn-col.pos .pn-c.sel{outline-color:var(--green)}.pn-c.sel .pn-ck{background:var(--red);border-color:var(--red);color:#fff}.pn-col.pos .pn-c.sel .pn-ck{background:var(--green);border-color:var(--green)}
.pn-all{margin-inline-start:6px;border:0;background:rgba(0,0,0,.06);border-radius:999px;padding:1px 8px;font-size:.75rem;color:var(--label-2)}
#pnDel{width:100%;min-height:46px}#pnDel:disabled{opacity:.4}

/* کپسول مثبت و منفی دانش‌آموز | Student Pos/Neg Capsule: دو ستون داخل یک کپسول */
.stat.pn2{display:flex;flex:2;gap:0;padding:0}.pn2c{flex:1;padding:11px 8px 9px}.pn2c+.pn2c{border-inline-start:1px solid var(--sep,rgba(0,0,0,.1))}
.pn2c b{display:block;font-size:1.5rem;font-weight:800;line-height:1.35}.pn2c span{display:block;font-size:.8125rem;color:var(--label-2);font-weight:600}
.pn2c.green b{color:var(--green)}.pn2c.red b{color:var(--red)}

/* کپسول‌های مثبت و منفی | Pos/Neg Capsules: کپسول هر دانش‌آموز، موردهای بازشده، دکمه‌های کپسولی سرتیتر و چیپ ماه */
.cap-b{border:0;border-radius:999px;padding:0 14px;min-height:34px;font-size:.9375rem;font-weight:700;white-space:nowrap}
.cap-b.tint{background:var(--tint-weak);color:var(--tint)}.cap-b.red{background:rgba(255,59,48,.14);color:var(--red)}.cap-b:disabled{opacity:.4}
.pn-months{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;-webkit-overflow-scrolling:touch}
.pn-months .chip{flex:none;border:0;border-radius:999px;padding:6px 14px;background:var(--fill);color:var(--label-2);font-weight:600;white-space:nowrap}
.pn-months .chip.on{background:var(--tint);color:#fff}
.pn-g{background:var(--card);border-radius:18px;padding:6px 10px;margin-bottom:6px}
.pn-cap{display:flex;align-items:center;gap:6px;min-height:34px;cursor:pointer}.pn-cap b{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn-cap i{font-style:normal;font-weight:800;min-width:22px;text-align:center;border-radius:999px;padding:0 6px;background:var(--fill)}
.pn-col.pos .pn-cap i{color:var(--green)}.pn-col.neg .pn-cap i{color:var(--red)}
.pn-cap svg{width:14px;height:14px;color:var(--label-3);transition:transform .2s}.pn-g.open .pn-cap>svg{transform:rotate(-90deg)}
.pn-p{display:block;color:var(--label-3);font-size:.75rem;line-height:1.5;padding:0 2px 4px}
.pn-es{border-top:1px solid rgba(0,0,0,.07);padding-top:4px}.pn-e{display:flex;align-items:flex-start;gap:6px;padding:5px 0;font-size:.8125rem;line-height:1.5}
.pn-e .pn-t{flex:1;min-width:0}.pn-d{display:block;color:var(--label-3);font-size:.6875rem}
.pn-ck{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--label-3);display:inline-flex;align-items:center;justify-content:center;color:transparent}
.pn-ck svg{width:12px;height:12px}
.pn-e.sel .pn-ck,.pn-ck.on{background:var(--red);border-color:var(--red);color:#fff}.pn-col.pos .pn-e.sel .pn-ck,.pn-col.pos .pn-ck.on{background:var(--green);border-color:var(--green)}
.pn-in{min-height:34px;padding:4px 8px;font-size:.8125rem}

/* دکمهٔ قفل | Lock Button: اندازهٔ ثابت؛ خاموش خاکستری و روشن نارنجی */
.btn.glk{width:100%;background:var(--fill);color:var(--label-2)}.btn.glk svg{width:18px;height:18px}
.btn.glk.lkon{background:rgba(255,149,0,.2);color:var(--orange)}.btn.glk:disabled{opacity:.45}
/* هم‌قد کردن کپسول‌ها | Equal Capsules: ارتفاع ثابت و نام کامل‌تر (تا دو خط) */
.pn-cap{height:44px;min-height:44px}.pn-cap b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.875rem;line-height:1.25}
.pn-cap svg{transform:none}.pn-g.open .pn-cap>svg{transform:rotate(-90deg)}
.pn-in{resize:none;overflow:hidden;line-height:1.5;white-space:pre-wrap}

/* نام قابل‌لمس | Touchable Name: انیمیشن بزرگ‌شدن هنگام نگه‌داشتن */
.stn{display:inline-block;transition:transform .22s cubic-bezier(.2,.8,.3,1),color .2s;transform-origin:center right;-webkit-touch-callout:none}
.stn.lp{transform:scale(1.14);color:var(--tint)}
/* شمارهٔ مورد | Entry Number: شمارهٔ هر مورد در برگهٔ مثبت و منفی */
.pn-no{display:inline-block;min-width:18px;color:var(--label-3);font-weight:700;margin-inline-end:2px}
/* دکمهٔ دایره‌ای | Round Buttons: ضربدر بستن، مداد ویرایش و دکمه‌های روز قبل/بعد */
.cap-b.ic{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center}.cap-b.ic svg{width:18px;height:18px}
.cap-b.solid{background:var(--tint);color:#fff}.cap-b.x{background:var(--fill);color:var(--label-2)}
.qc-nav .dnav{width:38px;height:38px;border-radius:50%;background:var(--tint-weak)}
/* زنگ فعلی | Current Period: زنگ جاری پررنگ و بقیه کمرنگ */
.group.hascur .per:not(.cur){opacity:.42}.wk.hascur td:not(.cur):not(.e){opacity:.45}

/* ---- ویرایش با مداد | Pencil Editing: ظاهر خانه‌های فرم ویرایش، ردیف لینک و دکمه‌های پایین فرم ---- */
.ef-g{margin-bottom:10px;overflow:hidden}.ef-g:empty{display:none}
.ef{display:flex;align-items:center;gap:10px;min-height:48px;padding:4px 14px;position:relative}.ef+.ef{border-top:.5px solid var(--sep)}
.ef>span{flex:0 0 38%;font-size:.9375rem;font-weight:600}.ef input,.ef select,.ef textarea{flex:1;min-width:0;font-size:max(16px,1rem);padding:8px 0;background:none;color:inherit}
.ef select{height:40px}.ef.sl::after{content:'▾';color:var(--label-3);font-size:.8rem}
.ef.ar{align-items:flex-start;flex-direction:column;gap:2px;padding:8px 14px}.ef.ar>span{flex:none}.ef.ar textarea{width:100%;resize:none;line-height:1.7}
.ef-lk{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center;padding:6px 10px}.ef-lk .cap-b{order:2}.ef-lk [data-lu]{order:3;flex:1 1 100%}.ef-lk+.ef-lk{border-top:.5px solid var(--sep)}.ef-lk input{flex:1;min-width:0;padding:8px 0;font-size:max(16px,1rem)}.ef-lk [data-lt]{flex:1 1 0;order:1;font-weight:600}
.ef-add{display:flex;gap:8px;justify-content:center;margin:4px 0 12px}.ef-del{display:flex;justify-content:center;margin:8px 0 18px}

/* ---- اصلاحات بازبینی | Review Fixes: دکمهٔ بستن برگه در منتهای چپ، دکمهٔ برگشت گرد، کپسول قبلی/بعدی کمرنگ در ابتدا و انتهای فهرست، برچسب‌های قابل لمس ---- */
.sheet .sh-head>.cap-b{justify-self:end}
.nav-back,.nav-btn.nav-back{width:36px;height:36px;min-width:36px;min-height:36px;padding:0;border-radius:50%}
.stepb.off{opacity:.3;background:var(--fill)}

<body>
<!-- اگر جاوااسکریپت خاموش باشد | No-Script Notice: پیام ساده برای وقتی که مرورگر برنامه را اجرا نمی‌کند -->
<noscript><p style="padding:40px;text-align:center;font-family:sans-serif">برای استفاده از توت فرنگی جاوااسکریپت مرورگر باید روشن باشد.</p></noscript>
<!-- قاب برنامه | App Shell: صحنهٔ صفحه‌ها، نوار تب‌های پایین و لایهٔ پنجره‌ها/پیام‌ها؛ همهٔ صفحه‌ها با جاوااسکریپت داخل #stage ساخته می‌شوند -->
<div id="app">
  <!-- نوار بالای دوره | Course Top Bar: شیفت و زنگ جاری (مثل برنامهٔ دسکتاپ) و وضعیت ذخیره روی سرور؛ فقط داخل دوره پیداست -->
  <header id="bellbar" aria-label="شیفت و زنگ"><div class="bb-in"><button class="bb-main" data-act="bellList" aria-label="زنگ‌های امروز"><span class="bb-sh"></span><span class="bb-name"></span><span class="bb-left"></span></button><button class="bb-sync" data-act="syncInfo" aria-label="وضعیت ذخیره"></button></div><i class="bb-prog"></i></header>
  <div id="stage"></div>
  <nav id="tabbar" class="hidden" aria-label="بخش‌های دوره"></nav>
  <div id="overlay"></div>
</div>
<script>


/* ================================================================
   ۴) هستهٔ برنامه | 4) App Core
   ابزارهای کوچک و مشترک که همهٔ صفحه‌ها از آن‌ها استفاده می‌کنند: متن امن، رقم فارسی، تاریخ شمسی، آیکون‌ها و نمره‌ها.
   ================================================================ */

/* ---- ۴.۱ ابزارهای کوچک | 4.1 Small Helpers ---- */
/* یافتن عنصر | Element Finder: $ یک عنصر و $$ همهٔ عنصرهای هم‌نام را از صفحه پیدا می‌کند */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
/* متن امن | Escape Text: هر متنی که از سرور می‌آید قبل از نمایش امن می‌شود تا علامت‌های خاص صفحه را خراب نکنند */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* رقم فارسی | Persian Digits: pd هر رقم انگلیسی داخل متن را فارسی می‌کند؛ fn عدد را فارسی می‌نویسد؛ fd رقم‌های فارسی و عربی را به انگلیسی برمی‌گرداند */
const PDG = '۰۱۲۳۴۵۶۷۸۹';
const pd = x => String(x == null ? '' : x).replace(/\d/g, d => PDG[+d]);
const fn = n => pd(Number(n)).replace('.', '٫');
const fd = s => String(s == null ? '' : s).replace(/[۰-۹]/g, c => PDG.indexOf(c)).replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c));

const qv = n => pd(String(Math.round(n * 100) / 100)).replace('.', '٫');

/* ---- ۴.۲ تاریخ شمسی | 4.2 Persian Calendar ---- */
/* نام ماه‌ها و روزها | Month & Day Names: نام ماه‌های شمسی و روزهای هفته؛ روز هفته از شمارهٔ جاوااسکریپت (یکشنبه = ۰) گرفته می‌شود */
const JM = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
const DAYN = { 6: 'شنبه', 0: 'یکشنبه', 1: 'دوشنبه', 2: 'سه‌شنبه', 3: 'چهارشنبه', 4: 'پنج‌شنبه', 5: 'جمعه' };
const DY = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه'];
const DYS = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه'];
/* تبدیل به شمسی | To Jalali: تاریخ میلادی را به سال، ماه و روز شمسی تبدیل می‌کند */
const jd = dt => {
  const o = {};
  new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn', { year: 'numeric', month: 'numeric', day: 'numeric' }).formatToParts(dt).forEach(x => {
    if (x.type === 'day') o.d = +x.value; else if (x.type === 'month') o.m = +x.value; else if (x.type === 'year' || x.type === 'relatedYear') o.y = +x.value;
  });
  return o;
};
/* کلید روز | Day Key: تاریخ را به متن «سال-ماه-روز» میلادی تبدیل می‌کند؛ حضور و غیاب و چک‌لیست با همین کلید ذخیره شده‌اند */
const dkey = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
/* از کلید به تاریخ | Key To Date: متن «سال-ماه-روز» را دوباره به تاریخ برمی‌گرداند (ظهر، تا ساعت تابستانی اذیت نکند) */
const kdate = k => { const p = String(k).split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12); };
/* برچسب تاریخ | Date Labels: چند شکل نوشتن تاریخ شمسی (کوتاه، با نام ماه، کامل با روز هفته) */
const jShort = dt => { const j = jd(dt); return fn(j.m) + '/' + fn(j.d); };
const jMonthDay = dt => { const j = jd(dt); return fn(j.d) + ' ' + JM[j.m - 1]; };
const jFull = dt => { const j = jd(dt); return DAYN[dt.getDay()] + ' ' + fn(j.d) + ' ' + JM[j.m - 1] + ' ' + fn(j.y); };
const jNum = dt => { const j = jd(dt); return fn(j.y) + '/' + fn(j.m) + '/' + fn(j.d); };
/* روز هفته از شنبه | Day Index From Saturday: شنبه = ۰ تا جمعه = ۶ */
const satIdx = dt => (dt.getDay() + 1) % 7;
/* روزهای یک هفته | Week Days: پنج روز مدرسه (شنبه تا چهارشنبه)؛ off = چند هفته جلو یا عقب؛ هفتهٔ جاری از آخرین شنبه شروع می‌شود */
const weekDays = off => {
  const n = new Date(), b = satIdx(n);
  return [0, 1, 2, 3, 4].map(i => new Date(n.getFullYear(), n.getMonth(), n.getDate() - b + (off || 0) * 7 + i, 12));
};
/* روز مدرسه نیست؟ | Is Weekend: پنجشنبه و جمعه تعطیل‌اند */
const isOff = dt => dt.getDay() === 4 || dt.getDay() === 5;
/* شروع ماه شمسی | Month Start: تاریخ میلادی اولین روز یک ماه شمسی را پیدا می‌کند */
const monthStart = (y, m) => {
  const T = y * 10000 + m * 100 + 1, k = j => j.y * 10000 + j.m * 100 + j.d;
  const d = new Date(y + 621, 2, 21, 12);
  d.setDate(d.getDate() + (m <= 6 ? (m - 1) * 31 : 186 + (m - 7) * 30));
  for (let i = 0; i < 70 && k(jd(d)) > T; i++) d.setDate(d.getDate() - 1);
  for (let i = 0; i < 70 && k(jd(d)) < T; i++) d.setDate(d.getDate() + 1);
  return d;
};
/* روزهای مدرسهٔ یک ماه | Month School Days: همهٔ روزهای شنبه تا چهارشنبهٔ یک ماه شمسی */
const monthDays = (y, m) => {
  const out = []; const d = monthStart(y, m);
  while (jd(d).m === m && out.length < 40) { if (!isOff(d)) out.push(new Date(d)); d.setDate(d.getDate() + 1); }
  return out;
};
