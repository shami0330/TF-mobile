/* ================================================================
   ۱۲) حضور و غیاب | 12) Attendance
   نمای روزانه (نوار روزهای هفته، آمار و فهرست دانش‌آموزان) و نمای ماهانه (غیبت هر دانش‌آموز و نقطه‌های روزها).
   در نمای روزانه حضور و غیاب ثبت می‌شود (دکمهٔ حاضر ✓ و غایب ✕ برای هر دانش‌آموز، «همه حاضر» و قفل روز) و روی سرور ذخیره می‌شود؛ لمس نام هر دانش‌آموز صفحهٔ او را باز می‌کند.
   ================================================================ */

/* ---- ۱۲.۱ وضعیت اولیه | 12.1 Initial State ---- */
/* وضعیت اولیهٔ حضور و غیاب | Attendance Defaults: اولین بار روز پیش‌فرض (امروز یا آخرین روز مدرسه) و ماه جاری انتخاب می‌شود */
const attInit = st => {
  if (st.mode) return st;
  const d = defDay(), j = jd(todayD());
  st.mode = 'day'; st.sel = dkey(d); st.off = weekOff(d); st.f = 'all'; st.mo = { y: j.y, m: j.m };
  return st;
};

/* ---- ۱۲.۲ برچسب وضعیت | 12.2 Status Pill ---- */
/* قرص وضعیت | Status Pill: حاضر (سبز)، غایب (قرمز) یا ثبت‌نشده (خاکستری) */
const attPill = v => (v === 1 ? '<span class="pill green">حاضر</span>' : v === 0 ? '<span class="pill red">غایب</span>' : '<span class="pill">ثبت نشده</span>');

/* ---- ۱۲.۳ نمای روزانه | 12.3 Day View ---- */
/* نمای روزانه | Day View: نوار هفته، تاریخ روز، سه کاشی آمار (با فیلتر) و فهرست دانش‌آموزان */
const attDayView = (c, st) => {
  const k = st.sel, d = kdate(k), ad = attDay(c, k), marks = {};
  weekDays(st.off).forEach(x => { if (attDay(c, dkey(x)).rec) marks[dkey(x)] = 1; });
  let h = '<div class="day-head"><b>' + esc(jFull(d)) + '</b>' + (attLocked(c, k) ? '<span class="pill orange">' + ico('lock') + 'قفل‌شده</span>' : '') + '</div>';
  h += dayStripH({ off: st.off, sel: k, marks, pick: 'attPick', nav: 'attWeek' });
  const tile = (f, cls, n, t) => '<button class="stat ' + cls + (st.f === f ? ' on' : '') + '" data-act="attFilter" data-a="' + f + '">' + (f === 'a' ? ppl('abs') : '') + '<b>' + fn(n) + '</b><span>' + t + '</span></button>';
  h += '<div class="stats">' + tile('a', 'red', ad.a, 'غایب') + '</div>';
  const L = STU(c).filter(s => { const v = attOf(c, k, s.id); return st.f === 'all' || (st.f === 'p' && v === 1) || (st.f === 'a' && v === 0) || (st.f === 'n' && v !== 1 && v !== 0); });
  const lk = attLocked(c, k);
  h += attTools(c, k, lk, ad);
  if (!L.length) return h + emptyH('users', 'موردی نیست', st.f === 'all' ? 'هنوز دانش‌آموزی در این دوره ثبت نشده.' : 'در این فیلتر دانش‌آموزی نیست.');
  return h + '<div class="group' + (lk ? ' locked' : '') + '" id="attList">' + L.map(s => attRow(c, s, k, lk)).join('') + '</div>'
    + (st.f !== 'all' ? '<div class="pad-x"><button class="btn plain" data-act="attFilter" data-a="all">نمایش همه</button></div>' : '');
};

/* ---- ۱۲.۳ب ابزار و ردیف ثبت | 12.3b Entry Tools & Row ---- */
/* ردیف ثبت حضور | Attendance Row: عکس و نام (لمس = صفحهٔ دانش‌آموز) و دو دکمهٔ حاضر ✓ و غایب ✕؛ لمس دوبارهٔ همان دکمه وضعیت را پاک می‌کند */
const attRow = (c, s, k, lk) => {
  const v = attOf(c, k, s.id), tg = stuTags(s).map(x => '<span class="tag">' + esc(x) + '</span>').join('');
  const m = v === 1 ? ['p on', 'pres', 'حاضر'] : v === 0 ? ['a on', 'abs', 'غایب'] : ['n', 'minus', 'ثبت نشده'];
  const btn = '<button class="abt ' + m[0] + '" data-act="attSet" data-a="' + esc(s.id) + '" aria-label="' + m[2] + '"' + (lk ? ' disabled' : '') + '>' + (m[1] === 'pres' || m[1] === 'abs' ? ppl(m[1]) : ico(m[1])) + '</button>';
  return '<div class="row has-lead arow" data-sid="' + esc(s.id) + '"><span class="lead">' + avatar(s, 40) + '</span>'
    + '<span class="main tap" role="button"' + pushA('stuD', { sid: s.id, seg: 'att' }) + '><div class="ttl">' + stnH(s) + '</div>' + (tg ? '<div class="sub">' + tg + '</div>' : '') + '</span>'
    + '<span class="trail abtns">' + btn + '</span></div>';
};
/* ابزار روز | Day Tools: قفل کردن یا باز کردن قفل روز */
const attTools = (c, k, lk, ad) => {
  if (!STU(c).length) return '';
  /* دکمهٔ قفل روز | Day Lock Button: همیشه همین یک دکمه با همین اندازه و جا؛ با قفل شدن فقط رنگش عوض می‌شود */
  return '<div class="pad-x tools2"><button class="btn sm glk' + (lk ? ' lkon' : '') + '" data-act="attLock" data-a="' + (lk ? 0 : 1) + '"' + (!lk && !ad.rec ? ' disabled' : '') + '>' + ico('lock') + 'قفل روز</button></div>';
};

/* ---- ۱۲.۴ نمای ماهانه | 12.4 Month View ---- */
/* نمای ماهانه | Month View: ماه شمسی انتخاب‌شده، خلاصهٔ غیبت و برای هر دانش‌آموز تعداد غیبت با نقطه‌های روزهای ماه */
const attMonthView = (c, st) => {
  const { y, m } = st.mo, days = monthDays(y, m), tk = dkey(todayD()), cur = jd(todayD());
  const L = STU(c);
  const rec = days.filter(d => attDay(c, dkey(d)).rec).length;
  const per = L.map(s => { let a = 0; days.forEach(d => { if (attOf(c, dkey(d), s.id) === 0) a++; }); return a; });
  const tot = per.reduce((p, q) => p + q, 0), withAbs = per.filter(x => x > 0).length;
  let h = '<div class="mo-nav"><button class="dnav" data-act="attMonthGo" data-a="-1" aria-label="ماه قبل">' + ico('chev-r') + '</button><div class="t">' + JM[m - 1] + ' ' + fn(y) + '</div><button class="dnav" data-act="attMonthGo" data-a="1"' + ((y > cur.y || (y === cur.y && m >= cur.m)) ? ' disabled' : '') + ' aria-label="ماه بعد">' + ico('chev-l') + '</button></div>';
  h += '<div class="stats"><div class="stat tint"><b>' + fn(rec) + '</b><span>روز ثبت‌شده</span></div><div class="stat red">' + ppl('abs3') + '<b>' + fn(tot) + '</b><span>جمع غیبت‌ها</span></div><div class="stat orange">' + ppl('abs') + '<b>' + fn(withAbs) + '</b><span>دانش‌آموز غایب</span></div></div>';
  if (!rec) return h + emptyH('calendar', 'ثبتی در این ماه نیست', 'برای روزهای این ماه حضور و غیاب ثبت نشده است.');
  h += '<div class="group">' + L.map((s, i) => {
    const dots = '<div class="dots">' + days.map(d => { const k = dkey(d), v = attOf(c, k, s.id); return '<i class="dt ' + (k > tk ? 'f' : v === 1 ? 'p' : v === 0 ? 'a' : '') + '"></i>'; }).join('') + '</div>';
    return rowH({ lead: avatar(s, 40), ttl: stnH(s), sub: (per[i] ? '<span class="red">' + fn(per[i]) + ' روز غیبت</span>' : 'بدون غیبت') + dots, wrap: true, trail: per[i] ? '<span class="count-dot red">' + fn(per[i]) + '</span>' : '<span class="count-dot green">' + ico('check') + '</span>', chev: true, attr: pushA('stuD', { sid: s.id, seg: 'att' }) });
  }).join('') + '</div>';
  return h + '<div class="legend"><span class="lg"><i style="background:var(--green)"></i>حاضر</span><span class="lg"><i style="background:var(--red)"></i>غایب</span><span class="lg"><i style="background:var(--label-4)"></i>ثبت‌نشده</span></div>';
};

/* ---- ۱۲.۵ صفحهٔ اصلی | 12.5 Attendance Page ---- */
/* صفحهٔ حضور و غیاب | Attendance Page: تب اول هر دوره */
PAGES.att = r => {
  const c = C(), st = attInit(r.st);
  return {
    title: 'حضور و غیاب', large: true, tabs: true, lead: leaveBtn,
    trail: st.mode === 'day' ? '<button class="nav-btn" data-act="attToday">امروز</button>' : '',
    body: segH([['day', 'روزانه'], ['month', 'ماهانه']], st.mode, 'attMode') + (st.mode === 'day' ? attDayView(c, st) : attMonthView(c, st))
  };
};

/* ---- ۱۲.۶ کارهای حضور و غیاب | 12.6 Attendance Actions ---- */
/* کارها | Attendance Actions: تغییر نما، انتخاب روز، جابه‌جایی هفته و ماه، فیلتر و رفتن به امروز */
ACT.attMode = (el, a) => { stOf().mode = a; Nav.refresh(); };
ACT.attPick = (el, a) => { const s = stOf(); s.sel = a; s.off = weekOff(kdate(a)); Nav.refresh(); };
ACT.attWeek = (el, a) => {
  const s = stOf(), i = Math.max(0, weekDays(s.off).findIndex(x => dkey(x) === s.sel));
  s.off += +a; s.sel = dkey(weekDays(s.off)[i]); Nav.refresh();
};
ACT.attFilter = (el, a) => { const s = stOf(); s.f = s.f === a ? 'all' : a; Nav.refresh(); };
ACT.attMonthGo = (el, a) => { const s = stOf(); let { y, m } = s.mo; m += +a; if (m > 12) { m = 1; y++; } if (m < 1) { m = 12; y--; } s.mo = { y, m }; Nav.refresh(); };
ACT.attToday = () => { const s = stOf(), d = defDay(); s.sel = dkey(d); s.off = weekOff(d); s.f = 'all'; Nav.refresh(); };

/* ---- ۱۲.۷ ثبت حضور و غیاب | 12.7 Recording Attendance ---- */
/* ثبت وضعیت | Set Status: یک دکمه با هر لمس: حاضر ← غایب ← خالی. تغییر همان لحظه دیده می‌شود و روی سرور ذخیره می‌شود */
ACT.attSet = (el, sid) => {
  const c = C(), k = stOf().sel, cur = attOf(c, k, sid), nx = cur === 1 ? 0 : cur === 0 ? null : 1;
  if (!edit({ k: 'att', day: k, sid, v: nx })) return toast('این روز قفل است؛ اول قفلش را باز کن');
  Nav.refresh();
};
/* قفل روز | Lock Day: قفل کردن فوری؛ باز کردن قفل با تأیید */
ACT.attLock = (el, on) => {
  const k = stOf().sel, go = () => { edit({ k: 'attLk', day: k, on: on === '1' }); Nav.refresh(); };
  if (on === '1') { go(); toast('حضور و غیاب این روز قفل شد'); } else ask('قفل حضور و غیاب این روز باز شود؟ بعد از آن می‌شود دوباره تغییرش داد.', 'باز شود', go);
};


/* ================================================================
   ۱۳) چک‌لیست | 13) Checklist
   فهرست درس‌ها و دانش‌آموزان؛ صفحهٔ هر درس (روز و مورد انتخابی برای همهٔ کلاس) و صفحهٔ چک‌لیست هر دانش‌آموز با تاریخچهٔ نمره‌ها.
   هر دو روش نمره‌دهی (توصیفی ۱ تا ۴ و کمی ۰ تا ۲۰) پشتیبانی می‌شود. در صفحهٔ درس نمره ثبت می‌شود (۱ تا ۴، ۰ تا ۲۰، شایستگی مثبت و منفی، توضیح) و روی سرور ذخیره می‌شود؛ نمره‌های قفل‌شده در برنامهٔ اصلی فقط دیده می‌شوند.
   ================================================================ */

/* ---- ۱۳.۱ ابزارهای چک‌لیست | 13.1 Checklist Helpers ---- */
/* نوع مورد | Item Type: g نمره‌ای، t توصیفی (متن)، c شایستگی (مثبت و منفی) */
const ity = it => it.ty || 'g';
/* موردهای یک درس | Lesson Items: موردهای قابل نمایش؛ در روش کمی اگر درس مورد نداشته باشد یک مورد بی‌نام می‌سازد */
const itemsOf = (c, l) => (GM(c) === 'q' ? qRows(l) : arr(l.items));
/* نام مورد | Item Title: نام مورد یا (اگر بی‌نام بود) نام درس */
const itTitle = (l, it) => it.t || l.name || '';
/* آیکون درس | Lesson Icon: مربع رنگی با آیکون کتاب */
const lesIco = i => { const p = PAL[i % PAL.length]; return '<span class="ic-sq" style="background:linear-gradient(160deg,' + p[0] + ',' + p[1] + ')">' + ico('book') + '</span>'; };
/* نقطه‌های هفته | Week Marks: روزهای هفته‌ای که برای این مورد چیزی ثبت شده (برای نقطهٔ زیر روز) */
const chkMarks = (c, l, it, off) => {
  const q = GM(c) === 'q', key = l.id + '.' + it.id, m = {};
  weekDays(off).forEach(d => { const k = dkey(d); if (STU(c).some(s => dayVal(c, s.id, k, key, q) !== undefined || (ity(it) === 'c' && posVal(c, s.id, k, key) !== undefined))) m[dkey(d)] = 1; });
  return m;
};
/* مقدار شایستگی | Competency Count: تعداد و دلیل‌های یک ثبت مثبت یا منفی شایستگی */
const cNum = x => (x && typeof x === 'object' ? (+x.n || 0) : 0);
/* ---- ۱۳.۲b شایستگی‌ها (ثبت سریع) | 13.2b Quick Competency Entry ---- */
/* ثبت سریع شایستگی | Quick Competency: مثل برنامهٔ اصلی، دکمهٔ «شایستگی‌ها» برگه‌ای با همهٔ دانش‌آموزان باز می‌کند؛ برای هر نفر شمارندهٔ مثبت و منفی روز انتخاب‌شده (با دکمهٔ روز قبل/بعد/امروز)؛ با هر «+» دلیل اختیاری پرسیده می‌شود. ردیف شمارندهٔ شایستگی همان مورد نوع «شایستگی» در چک‌لیست است */
const qcKey = c => { if (GM(c) === 'q') return null; for (const l of CLS(c)) for (const it of itemsOf(c, l)) if (ity(it) === 'c') return l.id + '.' + it.id; return null; };
/* مثبت و منفی روز | Day Positives & Negatives: شایستگی‌های مثبت (w=p) یا منفی (w=n) ثبت‌شدهٔ یک روز در کل کلاس، به‌ترتیب دانش‌آموز، همراه با دلیل‌ها */
const negList = (c, k, w) => {
  const keys = []; CLS(c).forEach(l => itemsOf(c, l).forEach(it => { if (ity(it) === 'c') keys.push(l.id + '.' + it.id); }));
  const out = []; STU(c).forEach(s => { let n = 0; const why = []; keys.forEach(key => { const x = w === 'p' ? posVal(c, s.id, k, key) : dayVal(c, s.id, k, key, false), m = cNum(x); if (m) { n += m; cWhy(x).forEach(y => why.push(y)); } }); if (n) out.push({ s, n, why }); });
  return out;
};
/* قفل نمرات روز | Grades Day Lock: کلیدهای قفل همهٔ درس‌های دوره برای یک روز؛ وقتی همه قفل باشند «قفل‌شده» حساب می‌شود (مثل برنامهٔ اصلی در chkd) */
const gKeys = c => CLS(c).map(l => (GM(c) === 'q' ? 'q:' : '') + l.id);
const gLocked = (c, k) => { const K = gKeys(c); return K.length > 0 && K.every(x => !!(((c.chkd || {})[k] || {})[x])); };

/* ================================================================

/* ---- ۱۴.۱ نوار روزهای برنامه | 14.1 Weekday Strip ---- */
/* نوار روزها | Weekday Strip: پنج روز هفته (شنبه تا چهارشنبه)؛ روز جاری نقطه دارد */
const schStrip = (st) => {
  const td = todayD(), ti = isOff(td) ? -1 : satIdx(td);
  return '<div class="dwrap"><div class="dstrip">' + DY.map((n, i) => '<button class="dcell' + (i === st.di ? ' on' : '') + (i === ti ? ' today' : '') + '" data-act="schDay" data-a="' + i + '"><small>' + (i === ti ? 'امروز' : '&nbsp;') + '</small><b style="font-size:.9375rem">' + n + '</b></button>').join('') + '</div></div>';
};

/* ---- ۱۴.۲ نمای روزانه | 14.2 Day Schedule ---- */
/* ردیف زنگ | Period Row: ساعت شروع و پایان، نام درس با رنگ ثابت و برچسب «در حال برگزاری» */
const perRow = (c, x, isCur, left) => {
  const tm = x.a ? '<b>' + tmf(x.a) + '</b><span>' + tmf(x.e) + '</span>' : '<b>' + fn(x.i + 1) + '</b>';
  if (x.t === 'as') return '<div class="per brk' + (isCur ? ' cur' : '') + '"><div class="tm">' + tm + '</div><i class="bar"></i><div class="nm"><b>' + esc(x.name) + '</b></div></div>';
  if (x.t === 'b') return '<div class="per brk' + (isCur ? ' cur' : '') + '"><div class="tm">' + tm + '</div><i class="bar"></i><div class="nm"><b>' + esc(x.name) + '</b></div></div>';
  const l = x.l, col = l ? lessonCol(c, l)[1] : '';
  return '<div class="per' + (isCur ? ' cur' : '') + (l ? '' : ' none') + '"' + (l ? pushA('lesD', { uid: l.uid }) + ' role="button"' : '') + ' style="--c:' + col + '"><div class="tm">' + tm + '</div><i class="bar"></i>'
    + '<div class="nm"><b>' + (l ? esc(l.name) : 'بدون درس') + '</b><span>' + esc(x.name) + (isCur ? ' · ' + fn(left) + ' دقیقه مانده' : '') + '</span></div>'
    + (isCur ? '<span class="pill tint" style="align-self:center">در حال برگزاری</span>' : '') + (l ? ico('chev-l', 'chev') : '') + '</div>';
};
/* نمای روز | Day Schedule View: همهٔ زنگ‌های یک روز */
const schDayView = (c, st) => {
  const date = weekDays(0)[st.di], rows = dayPlan(c, st.di, date), td = todayD();
  const cur = (td.getDay() === date.getDay() && !isOff(td)) ? curSlot(rows) : null;
  const has = rows.some(x => x.t === 'p' && x.l);
  let h = '<div class="day-head"><b>' + DY[st.di] + '</b>' + (c.bel && c.bel.sh ? '<span class="pill">' + SHN[shOf(c.bel, date)] + '</span>' : '') + '</div>';
  if (!rows.length || (!has && !rows.some(x => x.a))) return h + emptyH('calendar', 'برنامه‌ای ثبت نشده', 'برای این روز زنگ یا درسی در برنامهٔ اصلی تنظیم نشده است.');
  return h + '<div class="group' + (cur ? ' hascur' : '') + '">' + rows.map((x, i) => perRow(c, x, !!cur && cur.i === i, cur ? cur.left : 0)).join('') + '</div>';
};

/* ---- ۱۴.۳ جدول هفتگی | 14.3 Weekly Grid ---- */
/* جدول هفته | Week Grid: ردیف = زنگ، ستون = روز؛ هر درس با رنگ ثابت خودش */
const schWeekView = c => {
  const days = weekDays(0), plans = days.map((d, i) => dayPlan(c, i, d).filter(x => x.t === 'p'));
  const n = Math.max(0, ...plans.map(p => p.length)), td = todayD(), ti = isOff(td) ? -1 : satIdx(td);
  if (!n) return emptyH('calendar', 'برنامه‌ای ثبت نشده', 'برنامهٔ هفتگی در برنامهٔ اصلی تنظیم نشده است.');
  const cur = ti >= 0 ? curSlot(dayPlan(c, ti, td)) : null, curP = cur ? dayPlan(c, ti, td)[cur.i] : null;
  let h = '<div class="wkw"><table class="wk' + (curP ? ' hascur' : '') + '"><tr><th class="pn"></th>' + DY.map((x, i) => '<th class="' + (i === ti ? 'tdy' : '') + '">' + x + '</th>').join('') + '</tr>';
  for (let i = 0; i < n; i++) {
    h += '<tr><th class="pn">' + fn(i + 1) + '</th>';

      const x = plans[d][i], l = x && x.l;
      if (!l) { h += '<td class="e">—</td>'; continue; }
      const p = lessonCol(c, l), on = curP && d === ti && curP.i === i;
      h += '<td' + pushA('lesD', { uid: l.uid }) + ' class="' + (on ? 'cur' : '') + '" style="--a1:' + p[0] + ';--a2:' + p[1] + '">' + esc(l.name) + '</td>';
    }

  }
  return h + '</table></div>';
};

/* صفحهٔ برنامه | Schedule Page: تب سوم هر دوره */
PAGES.sch = r => {

/* ---- ۱۶.۱۲ به‌روزرسانی برنامه | 16.12 App Update ---- */
/* منبع به‌روزرسانی | Update Source: مخزن گیت‌هاب به‌طور خودکار پیدا می‌شود، پس نیازی به وارد کردن لینک نیست. اولویت: ۱) مقدار داخل فایل (هنگام ساخت) ۲) آدرس گیت‌هاب‌پیجز (user.github.io/repo/فایل) ۳) ورود دستی در برگه (فقط اگر هیچ‌کدام پیدا نشد) */
const UPD_BUILTIN = null;
const HOST_URL = (() => { try { if (location.protocol !== 'blob:') sessionStorage.setItem('tfm-hosturl', location.origin + location.pathname); return sessionStorage.getItem('tfm-hosturl') || ''; } catch (e) { return ''; } })();
const HOST_BUILD = (() => { try { if (location.protocol !== 'blob:') sessionStorage.setItem('tfm-hostb', APP_BUILD); return sessionStorage.getItem('tfm-hostb') || APP_BUILD; } catch (e) { return APP_BUILD; } })();
/* به‌روزرسانی | Updater: تاریخ آخرین تغییر فایل را از گیت‌هاب می‌پرسد؛ اگر تازه‌تر بود و تأیید شد، فایل جدید دانلود و در حافظهٔ گوشی نگه داشته می‌شود و برنامه با آن دوباره باز می‌شود */
const Upd = {
  avail: null, busy: false,
  /* حدس از آدرس | Guess From URL: از نشانی github.io نام مخزن و فایل را می‌خواند (user.github.io/repo/app.html ← user/repo و app.html) */
  guess() {
    try {
      const u = new URL(HOST_URL), m = /^([\w-]+)\.github\.io$/i.exec(u.hostname); if (!m) return null;
      const seg = u.pathname.split('/').filter(Boolean), last = seg.length && /\.html?$/i.test(seg[seg.length - 1]) ? seg.pop() : 'index.html';
      return { repo: seg.length ? m[1] + '/' + seg[0] : m[1] + '.github.io', path: seg.slice(1).concat(last).join('/'), br: '' };
    } catch (e) { return null; }
  },
  auto_src() { const b = UPD_BUILTIN && UPD_BUILTIN.repo ? UPD_BUILTIN : null; return b ? Object.assign({ path: 'index.html', br: '' }, b) : Upd.guess(); },
  cfg() { const m = Pref.get('updcfg', null); return m && m.repo && m.path ? Object.assign({ br: '' }, m) : (Upd.auto_src() || { repo: '', path: '', br: '' }); },
  inst() { return Pref.get('updinst', null); },
  /* بررسی | Check: آخرین کامیت همان فایل را می‌گیرد. بار اول (بدون نصب قبلی) اگر کامیت بعد از زمان ساخت همین فایل نباشد، فقط به‌عنوان مبنا ثبت می‌شود تا بی‌خود پیشنهاد نصب ندهد */
  async check() {
    const c = Upd.cfg();
    if (!/^[\w.-]+\/[\w.-]+$/.test(c.repo) || !c.path.trim()) throw new Error('نشانی مخزن و مسیر فایل را وارد کن');
    const u = 'https://api.github.com/repos/' + c.repo + '/commits?per_page=1&path=' + encodeURIComponent(c.path.trim().replace(/^\//, '')) + (c.br.trim() ? '&sha=' + encodeURIComponent(c.br.trim()) : '');
    const r = await fetch(u, { headers: { Accept: 'application/vnd.github+json' } });
    if (r.status === 404) throw new Error('مخزن یا فایل پیدا نشد (مخزن باید عمومی باشد)');
    if (r.status === 403) throw new Error('گیت‌هاب موقتاً پاسخ نمی‌دهد؛ کمی بعد دوباره امتحان کن');
    if (!r.ok) throw new Error('پاسخ گیت‌هاب درست نبود (' + r.status + ')');
    const a = await r.json(), x = a && a[0];
    if (!x) throw new Error('برای این فایل سابقه‌ای در گیت‌هاب نیست');
    const date = (x.commit.committer || x.commit.author).date, i = Upd.inst();
    Pref.set('updlast', Date.now());
    let newer;
    if (i) newer = i.sha !== x.sha;
    else { newer = new Date(date).getTime() > new Date(APP_BUILD).getTime() + 15 * 60e3; if (!newer) Pref.set('updinst', { sha: x.sha, date }); }
    Upd.avail = newer ? { sha: x.sha, date, msg: String(x.commit.message || '').split('\n')[0] } : null;
    return Upd.avail;
  },
  /* نصب | Install: فایل همان کامیت را دانلود، سالم‌بودنش را بررسی و ذخیره می‌کند و صفحه را با آن دوباره باز می‌کند */
  async install() {
    const c = Upd.cfg(), a = Upd.avail; if (!a || Upd.busy) return;
    if (location.protocol === 'file:') return toast('به‌روزرسانی فقط وقتی برنامه از آدرس وب باز شده کار می‌کند', true);
    Upd.busy = true; Sheet.open({ title: 'به‌روزرسانی برنامه', body: '<div class="upd-load">' + ico('refresh') + '<b>در حال دانلود نسخهٔ جدید…</b><span>تا پایان کار برنامه را نبند</span></div>' });
    try {
      const r = await fetch('https://raw.githubusercontent.com/' + c.repo + '/' + a.sha + '/' + c.path.trim().replace(/^\//, ''));
      if (!r.ok) throw new Error('دانلود فایل نشد (' + r.status + ')');
      const html = await r.text();
      if (html.length < 50000 || !/<\/html>\s*$/i.test(html.trim()) || html.indexOf('TFM_CONFIG') < 0 && html.indexOf('tfm') < 0) throw new Error('فایل دانلودشده شبیه برنامه نیست؛ مسیر فایل را بررسی کن');
      await Cache.set('kv', 'ovr', { base: HOST_BUILD, html, sha: a.sha, date: a.date, t: Date.now() });
      Pref.set('updinst', { sha: a.sha, date: a.date });
      Upd.avail = null; Sheet.close(true); toast('نسخهٔ جدید نصب شد؛ در حال باز کردن دوباره…');
      setTimeout(() => location.reload(), 700);
    } catch (e) { Upd.busy = false; Sheet.close(true); toast(e && e.message ? e.message : 'به‌روزرسانی نشد', true); }
  },
  /* پس‌زمینه | Background Check: چند ثانیه بعد از باز شدن، حداکثر هر شش ساعت یک بار بی‌صدا بررسی می‌کند و اگر نسخهٔ تازه بود فقط می‌پرسد دانلود شود یا نه */
  async auto() {
    const c = Upd.cfg(); if (!c.repo || !c.path || navigator.onLine === false || Date.now() - Pref.get('updlast', 0) < 6 * 3600e3 || location.protocol === 'file:') return;
    try { await Upd.check(); } catch (e) { return; }

/* یک خانهٔ فرم | Form Field: t = text / tel / num / area / sel / h (تیتر گروه)؛ o = گزینه‌های انتخابی؛ v = مقدار فعلی */
const efH = f => {
  if (f.t === 'h') return '</div><div class="group-h">' + esc(f.l) + '</div><div class="group ef-g">';
  const v = f.v == null ? '' : String(f.v), at = ' data-ef="' + f.k + '" data-o="' + esc(v) + '"';
  let el;
  if (f.t === 'area') el = '<textarea' + at + ' rows="3" autocomplete="off">' + esc(v) + '</textarea>';
  else if (f.t === 'sel') el = '<select' + at + '>' + arr(f.o).map(o => '<option value="' + esc(o[0]) + '"' + (String(o[0]) === v ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>';
  else el = '<input' + at + ' value="' + esc(v) + '" autocomplete="off"' + (f.t === 'tel' ? ' inputmode="tel" dir="ltr" class="ltr-in"' : f.t === 'num' ? ' inputmode="numeric" dir="ltr" class="ltr-in"' : '') + '>';
  return '<label class="ef' + (f.t === 'area' ? ' ar' : '') + (f.t === 'sel' ? ' sl' : '') + '"><span>' + esc(f.l) + '</span>' + el + '</label>';
};
/* باز کردن فرم | Open Form: o = {title, fields, req (کلیدهای ناگزیر)، save(vals,changed,sheet)، del:{msg,fn}، extra (HTML اضافه)} */
const edSheet = o => {
  ED.cur = o;
  const body = '<div class="group ef-g">' + o.fields.map(efH).join('') + '</div>' + (o.extra || '')
    + (o.del ? '<div class="ef-del"><button class="cap-b ic red" data-act="edDel" aria-label="' + esc(o.del.label || 'حذف') + '">' + ico('trash') + '</button></div>' : '');
  Sheet.open({ title: o.title, act: '<button class="cap-b ic tint" data-act="edSave" aria-label="ذخیره">' + ico('check') + '</button>', body });
};
/* ذخیرهٔ فرم | Save Form: فقط خانه‌هایی که عوض شده‌اند به‌صورت دستور ثبت می‌شوند؛ ناگزیرها باید پر باشند */
ACT.edSave = () => {
  const E = ED.cur, sh = $('.sheet'); if (!E || !sh) return;
  const vals = {}, ch = {};
  $$('[data-ef]', sh).forEach(el => { const v = el.value.trim(); vals[el.dataset.ef] = v; if (v !== (el.dataset.o || '')) ch[el.dataset.ef] = v; });
  const miss = arr(E.req).find(k => !vals[k]);
  if (miss) { const f = E.fields.find(x => x.k === miss); toast('«' + (f ? f.l : 'نام') + '» را پر کن', true); return; }
  if (E.save(vals, ch, sh) === false) { toast('ذخیره نشد', true); return; }
  ED.cur = null; Sheet.close(); toast('ذخیره شد'); Nav.refresh();
};
/* حذف از فرم | Delete From Form: پرسش تأیید و سپس اجرای حذف */
ACT.edDel = () => { const E = ED.cur; if (!E || !E.del) return; ask(E.del.msg, E.del.label || 'حذف', () => { if (E.del.fn() === false) return toast('حذف نشد', true); ED.cur = null; toast('حذف شد'); if (E.del.back) Nav.pop(); else Nav.refresh(); }, true); };
/* ثبت یک مقدار | Set Value: نوشتن یک مقدار در مسیر داده؛ مقدار خالی کلید را پاک می‌کند */
const edSet = (path, v) => edit({ k: 'set', path, v: v === '' ? null : v });
const edId = p => p + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);

/* ---- ۱۸.۳ فرم دانش‌آموز | 18.3 Student Form ---- */
/* فرم دانش‌آموز | Student Form: نام، جنسیت و همهٔ فیلدهای پروندهٔ دانش‌آموز؛ دانش‌آموز تازه هم با همین فرم ساخته می‌شود */
const AREA_SF = ['addr', 'weak', 'good', 'ill', 'talent', 'help'];
/* گزینه‌ای‌ها | Choice Fields: فیلدهای بله/خیر و عددی مثل برنامهٔ اصلی با انتخاب پر می‌شوند */
const YN_ = ['بله', 'خیر'], N0_ = [...Array(11).keys()].map(String), SF_SEL = { glass: YN_, hear: YN_, lh: YN_, sib: N0_, rank: N0_ };
const sfField = (f, s) => { const v = s[f[0]] == null ? '' : String(s[f[0]]), o = SF_SEL[f[0]]; if (o) return { k: f[0], l: f[1], t: 'sel', v, o: [['', '—']].concat((o.includes(v) || !v ? o : o.concat([v])).map(x => [x, x])) }; return { k: f[0], l: f[1], v: s[f[0]], t: f[2] === 'p' ? 'tel' : AREA_SF.includes(f[0]) ? 'area' : 'text' }; };
const stuFields = s => [{ t: 'h', l: 'نام' }, { k: 'fn', l: 'نام', v: s.fn }, { k: 'ln', l: 'نام خانوادگی', v: s.ln },
  { k: 'tg', l: 'تگ‌ها (با ، جدا)', v: stuTags(s).join('، ') },
  { k: 'gender', l: 'جنسیت', t: 'sel', v: s.gender || '', o: [['', '—'], ['دختر', 'دختر'], ['پسر', 'پسر']] }]
  .concat(SF.map(f => f[0] === 'h' ? { t: 'h', l: f[1] } : sfField(f, s)));
const stuVal = (k, v) => ['shad', 'fphone', 'ephone'].includes(k) ? fd(v) : k === 'tg' ? tgArr(v) : v;
/* برچسب‌ها | Tags: متن جداشده با ویرگول را به فهرست برچسب تبدیل می‌کند (تکراری‌ها حذف؛ خالی = پاک کردن) */
const tgArr = v => { const L = [...new Set(String(v || '').split(/[،,]/).map(x => x.trim()).filter(Boolean))]; return L.length ? L : ''; };
const ED_FORMS = {};
ED_FORMS.stu = p => {
  const c = C(), s = stuById(c, p.sid); if (!s) return;
  const sel = { f: 'id', v: s.id };
  edSheet({ title: 'ویرایش دانش‌آموز', fields: stuFields(s), req: ['fn'],
    save: (vals, ch) => { Object.keys(ch).forEach(k => edSet(['students', sel, k], stuVal(k, ch[k]))); },
    del: { label: 'حذف دانش‌آموز', msg: 'این دانش‌آموز از دوره حذف شود؟ نمره‌ها و حضور و غیابش هم از دسترس خارج می‌شود.', back: true, fn: () => edit({ k: 'arrDel', path: ['students'], sel }) } });
};
ED_FORMS.stuAdd = () => {
  edSheet({ title: 'دانش‌آموز تازه', fields: stuFields({}), req: ['fn'],
    save: vals => { const it = { id: edId('s') }; Object.keys(vals).forEach(k => { if (vals[k]) it[k] = stuVal(k, vals[k]); }); if (!it.tg) delete it.tg; return edit({ k: 'arrAdd', path: ['students'], item: it }); } });
};

/* ویرایش برچسب | Tag Editor: فرم کوچک برچسب‌های یک دانش‌آموز با گزینه‌های آمادهٔ برچسب‌های دیگر دانش‌آموزان؛ همان‌جا روی سرور هم ذخیره می‌شود */
ED_FORMS.stuTg = p => {
  const c = C(), s = stuById(c, p.sid); if (!s) return;
  const all = [...new Set(STU(c).flatMap(x => stuTags(x)))], cur = stuTags(s);
  const extra = all.length ? '<div class="group-h">تگ‌های این دوره</div><div class="ef-chips">' + all.map(t => '<button class="chip' + (cur.includes(t) ? ' on' : '') + '" data-act="edTg" data-a="' + esc(t) + '">' + esc(t) + '</button>').join('') + '</div>' : '';
  edSheet({ title: 'تگ‌های ' + (s.fn || sn(s)), fields: [{ k: 'tg', l: 'تگ‌ها', v: cur.join('، ') }], extra,
    save: (vals, ch) => { if ('tg' in ch) edSet(['students', { f: 'id', v: s.id }, 'tg'], tgArr(ch.tg)); } });
};
/* انتخاب برچسب آماده | Pick Tag Chip: برچسب را به کادر اضافه یا از آن حذف می‌کند */
ACT.edTg = (el, t) => { const i = $('.sheet [data-ef=tg]'); if (!i) return; const L = [].concat(tgArr(i.value) || []), x = L.indexOf(t); if (x >= 0) L.splice(x, 1); else L.push(t); i.value = L.join('، '); el.classList.toggle('on', x < 0); };

/* ---- ۱۸.۶ فرم درس و بودجه‌بندی | 18.6 Lesson & Budget Form ---- */
/* ردیف لینک | Link Row: دو کادر عنوان و نشانی با دکمهٔ پاک کردن */
const lkRow = (t, u) => '<div class="ef-lk"><input data-lt placeholder="عنوان" value="' + esc(t || '') + '" autocomplete="off"><input data-lu dir="ltr" class="ltr-in" placeholder="https://…" value="' + esc(u || '') + '" autocomplete="off"><button class="cap-b ic" data-act="edLkDel" aria-label="حذف">' + ico('trash') + '</button></div>';
ACT.edLkAdd = () => { const b = $('#edLks'); if (b) { b.insertAdjacentHTML('beforeend', lkRow('', '')); const i = $$('[data-lt]', b).pop(); if (i) i.focus(); } };
ACT.edLkDel = el => { const r = el.closest('.ef-lk'); if (r) r.remove(); };
/* فرم درس | Lesson Form: نام درس، بودجه‌بندی هر ماه (از…تا… برای دو نیمه) و لینک‌ها؛ دکمه‌های افزودن طرح درس و حذف درس */
ED_FORMS.les = p => {
  const c = C(), l = lessonByUid(c, p.uid); if (!l) return;
  const sel = { f: 'uid', v: l.uid }, B = obj(l.bud), fields = [{ k: 'name', l: 'نام درس', v: l.name }];
  MB.forEach((m, i) => { fields.push({ t: 'h', l: 'بودجه‌بندی ' + m }); [0, 1].forEach(h => { const x = obj(B[i + '_' + h]); fields.push({ k: 'a' + i + '_' + h, l: (h ? 'نیمهٔ دوم: از' : 'نیمهٔ اول: از'), t: 'num', v: x.a }, { k: 'b' + i + '_' + h, l: 'تا', t: 'num', v: x.b }); }); });
  const lk = arr(l.links).filter(x => x), extra = '<div class="group-h">لینک‌ها</div><div class="group ef-g2" id="edLks">' + lk.map(x => lkRow(x.t, x.u)).join('') + '</div><div class="ef-add"><button class="cap-b tint" data-act="edLkAdd">+ افزودن لینک</button><button class="cap-b tint" data-act="edPlanNew" data-a="' + esc(l.uid) + '">+ طرح درس تازه</button></div>';
  edSheet({ title: 'ویرایش درس', fields, extra, req: ['name'],
    save: (vals, ch, sh) => {
      if (ch.name != null) edSet(['lessons', sel, 'name'], ch.name);
      MB.forEach((m, i) => [0, 1].forEach(h => { const ka = 'a' + i + '_' + h, kb = 'b' + i + '_' + h; if (ka in ch || kb in ch) { const a = fd(vals[ka]), b = fd(vals[kb]); edSet(['lessons', sel, 'bud', i + '_' + h], a || b ? { a, b } : ''); } }));
      const now = $$('#edLks .ef-lk', sh).map(r => ({ t: $('[data-lt]', r).value.trim(), u: $('[data-lu]', r).value.trim() })).filter(x => x.u);
      if (JSON.stringify(now.map(x => [x.t, x.u])) !== JSON.stringify(lk.map(x => [x.t || '', x.u || '']).filter(x => x[1]))) edSet(['lessons', sel, 'links'], now);
    },
    del: { label: 'حذف درس', msg: 'این درس با بودجه‌بندی، طرح‌ها و لینک‌هایش حذف شود؟', back: true, fn: () => edit({ k: 'arrDel', path: ['lessons'], sel }) } });
};

/* ---- ۱۸.۸ فرم برنامهٔ هفتگی | 18.8 Weekly Schedule Form ---- */
/* برنامهٔ هفتگی | Weekly Schedule Form: برای هر روز و هر زنگ یک درس انتخاب می‌شود */
ED_FORMS.sch = () => {
  const c = C(), L = arr(c.lessons), opts = [['', '— بدون درس —']].concat(L.map(l => [l.uid, l.name])), fields = [], W = weekDays(0), was = {};
  DY.forEach((d, di) => {

/* ---- ۱۸.۱۰ ویرایش کارنامه | 18.10 Report Card Editing ---- */
/* ویرایش کارنامه | Report Card Edit Mode: مدادِ تب کارنامه حالت ویرایش را روشن و خاموش می‌کند؛ در این حالت هر ماه با لمس عوض می‌شود و توصیفات تحصیلی و انضباطی قابل نوشتن‌اند */
ED_FORMS.stuCard = () => { const st = stOf(), s = stuById(C(), Nav.top().p.sid); if (!s) return; if (!st.cardEd) { st.cardSnap = JSON.stringify({ rg: s.rg || null, rkDs: Array.isArray(s.rkDs) ? s.rkDs : null }); st.cardEd = true; } else { st.cardEd = false; st.cardSnap = null; toast('ذخیره شد'); } Nav.refresh(); };
/* لغو ویرایش کارنامه | Cancel Card Edit: نمره‌های دستی و توصیفات به حالت قبل از شروع ویرایش برمی‌گردند */
ED_FORMS.stuCardX = () => { const st = stOf(), s = stuById(C(), Nav.top().p.sid); if (!s) return; if (!st.cardSnap) { st.cardEd = false; Nav.refresh(); return; } const o = JSON.parse(st.cardSnap || '{}'), sel = { f: 'id', v: s.id }; edSet(['students', sel, 'rg'], o.rg || ''); edSet(['students', sel, 'rkDs'], o.rkDs || ''); st.cardEd = false; st.cardSnap = null; toast('تغییرها لغو شد'); Nav.refresh(); };
/* نمرهٔ دستی | Manual Grade: نمرهٔ دستی یک درس در یک ماه را روی دانش‌آموز می‌نویسد (مثل برنامهٔ اصلی روی نمرهٔ چک‌لیست اثر ندارد)؛ خالی = بازگشت به میانگین */
const rcSet = (sid, lid, mi, q, x) => { edSet(['students', { f: 'id', v: sid }, 'rg', (q ? 'q:' : '') + lid, +mi], x == null ? '' : x); Nav.refresh(); };
/* لمس یک ماه | Tap Month Cell: توصیفی = انتخاب یکی از چهار سطح؛ کمی = نوشتن عدد ۰ تا ۲۰ */
ACT.rcEd = (el, a) => {
  const c = C(), r = Nav.top(), s = stuById(c, r.p.sid); if (!s) return;
  const [lid, mi] = String(a).split('|'), rep = reportOf(c, s), row = rep.rows.find(x => String(x.l.id) === lid), q = rep.q;
  const ov = ((s.rg || {})[(q ? 'q:' : '') + lid] || {})[mi], has = typeof ov === 'number', ttl = (row ? row.l.name : '') + ' — ' + MO[+mi];
  /* چرخش مثل چک‌لیست | Cycle Like Checklist: هر لمس یک سطح بالاتر؛ خالی ← ۱ ← ۲ ← ۳ ← ۴ ← خالی (بازگشت به میانگین) */
  if (!q) { const cur = row && row.m[+mi] != null ? Math.min(4, Math.max(1, Math.round(row.m[+mi]))) : 0; rcSet(s.id, lid, mi, q, cur >= 1 && cur < 4 ? cur + 1 : cur === 4 ? null : 1); return; }
  const cur = row && row.m[+mi] != null ? r2(row.m[+mi]) : '';
  edSheet({ title: ttl, fields: [{ k: 'v', l: 'نمره (۰ تا ۲۰)', t: 'num', v: cur }],
    save: vals => { const t = fd(vals.v).replace('٫', '.'), x = t === '' ? null : parseFloat(t); if (x !== null && isNaN(x)) return false; rcSet(s.id, lid, mi, q, x === null ? null : Math.min(20, Math.max(0, x))); },
    del: has ? { label: 'بازگشت به میانگین', msg: 'نمرهٔ دستی پاک شود و میانگین چک‌لیست نشان داده شود؟', fn: () => { rcSet(s.id, lid, mi, q, null); } } : null });
};
/* توصیفات | Descriptions: هر دانش‌آموز چند توصیف دارد؛ هر کدام {id, t: متن, on: چشم روشن}. فقط توصیف‌های دارای چشم روشن در کارنامه دیده می‌شوند. (توصیف تک‌متنی قدیمی rkDesc اولین توصیف حساب می‌شود) */
const dsOf = s => Array.isArray(s.rkDs) ? s.rkDs : (s.rkDesc ? [{ id: 'dl', t: String(s.rkDesc), on: 1 }] : []);
/* ذخیرهٔ توصیفات | Save Descriptions: کل فهرست یک‌جا روی دانش‌آموز نوشته می‌شود */
const dsSave = (s, L) => edSet(['students', { f: 'id', v: s.id }, 'rkDs'], L.map(d => ({ id: d.id, t: d.t || '', on: d.on ? 1 : 0 })));
const dsCtx = () => { const s = stuById(C(), Nav.top().p.sid); return s ? { s, L: dsOf(s).map(d => Object.assign({}, d)) } : null; };
ACT.rkTxt = (el, v) => { const x = dsCtx(); if (!x) return; const d = x.L.find(y => y.id === el.dataset.a); if (d && d.t !== v) { d.t = v; dsSave(x.s, x.L); } };
ACT.rkEye = (el, id) => { const x = dsCtx(); if (!x) return; const d = x.L.find(y => y.id === id); if (d) { d.on = d.on ? 0 : 1; dsSave(x.s, x.L); Nav.refresh(); } };
ACT.rkAdd = () => { const x = dsCtx(); if (!x) return; x.L.push({ id: edId('d'), t: '', on: 1 }); dsSave(x.s, x.L); Nav.refresh(); };
ACT.rkDel = (el, id) => { const x = dsCtx(); if (!x) return; ask('این توصیف حذف شود؟', 'حذف', () => { dsSave(x.s, x.L.filter(y => y.id !== id)); Nav.refresh(); }, true); };
/* کادر توصیفات | Descriptions Box: در حالت دیدن فقط توصیف‌های دارای چشم روشن (شماره‌دار)؛ در حالت ویرایش همه با چشم، حذف و افزودن */
const dsBoxH = (s, ed) => {
  const L = dsOf(s), T = 'توصیفات تحصیلی و انضباطی';
  if (!ed) { const V = L.filter(d => d.on && String(d.t || '').trim()); return V.length ? groupH(T, V.map((d, i) => '<div class="plan-sec"><p><span class="pn-no">' + fn(i + 1) + '.</span> ' + esc(d.t).replace(/\n/g, '<br>') + '</p></div>').join('')) : ''; }
  return groupH(T, L.map((d, i) => '<div class="rkd' + (d.on ? '' : ' off') + '" id="rkd-' + esc(d.id) + '" data-qs="' + esc(d.id) + '"><span class="pn-no">' + fn(i + 1) + '.</span><textarea class="fld" rows="2" data-chg="rkTxt" data-a="' + esc(d.id) + '" placeholder="توصیف را بنویس…">' + esc(d.t || '') + '</textarea>'
    + '<div class="rkd-b"><button class="cap-b ic ' + (d.on ? 'tint' : '') + '" data-act="rkEye" data-a="' + esc(d.id) + '" aria-label="' + (d.on ? 'دیده می‌شود' : 'پنهان است') + '">' + ico(d.on ? 'eye' : 'eye-off') + '</button><button class="cap-b ic red" data-act="rkDel" data-a="' + esc(d.id) + '" aria-label="حذف">' + ico('trash') + '</button></div></div>').join('') + '<div class="ef-add"><button class="cap-b tint" data-act="rkAdd">+ افزودن توصیف</button></div>');
};


/* ================================================================
   ۱۹) گروه‌بندی | 19) Groups
   تب گروه‌بندی: ساختن گروه، انتخاب اعضا و سرگروه، و ثبت مثبت و منفی برای هر گروه (توضیح اختیاری است). همه‌چیز در کلید grp همان دوره نگه داشته می‌شود و روی سرور هم ذخیره می‌شود.
   ================================================================ */

/* ---- ۱۹.۱ داده‌ی گروه‌ها | 19.1 Group Data ---- */
/* دادهٔ گروه‌ها | Group Data: هر گروه = { id شناسه، nm نام، hd شناسهٔ سرگروه، m شناسهٔ اعضا، p مثبت‌ها، n منفی‌ها }؛ هر مثبت یا منفی = { id، d روز، t توضیح اختیاری } */
const GRP = c => arr(c && c.grp).filter(g => g && typeof g === 'object');
const grpById = (c, id) => GRP(c).find(g => String(g.id) === String(id));
const grpCopy = L => JSON.parse(JSON.stringify(L));
/* ذخیرهٔ گروه‌ها | Save Groups: کل فهرست گروه‌ها یک‌جا (روی گوشی و روی سرور) ذخیره می‌شود؛ فهرست خالی کلید را پاک می‌کند */
/* ذخیرهٔ سرور‌اول | Server-First Save: بدون اینترنت یا نشست ثبت نمی‌شود؛ وگرنه تغییر بلافاصله (بدون تأخیر صف) به سرور فرستاده می‌شود */
const grpPut = L => {
  if (!S.demo && (!Srv.has() || navigator.onLine === false)) { toast('اینترنت لازم است؛ گروه‌بندی فقط روی سرور ذخیره می‌شود', true); return false; }
  const ok = edit({ k: 'set', path: ['grp'], v: L.length ? grpCopy(L) : null });
  if (ok) Sync.flush();
  return ok;
};
/* اعضای گروه | Group Members: دانش‌آموزان واقعیِ گروه؛ سرگروه اول می‌آید */
const grpMem = (c, g) => arr(g.m).map(id => stuById(c, id)).filter(Boolean).sort((a, b) => (String(b.id) === String(g.hd)) - (String(a.id) === String(g.hd)));
/* رنگ گروه‌ها | Group Colors: هر گروه بر اساس جایگاهش یک رنگ برای آیکون می‌گیرد */
const GRP_COL = ['#007aff', '#34c759', '#ff9500', '#af52de', '#ff2d55', '#5ac8fa', '#ffcc00'];
/* شمار مثبت و منفی | Group Pos/Neg Count: آدمک سبز با شمار مثبت‌ها و آدمک قرمز با شمار منفی‌ها */
const grpPnH = g => '<span class="ab-row"><span class="ab-p pos">' + ppl('pos') + '<b>' + fn(arr(g.p).length) + '</b></span><span class="ab-p neg">' + ppl('neg') + '<b>' + fn(arr(g.n).length) + '</b></span></span>';

/* ---- ۱۹.۲ صفحهٔ گروه‌بندی | 19.2 Groups Page ---- */
/* صفحهٔ گروه‌بندی | Groups Page: تب گروه‌بندی؛ فهرست گروه‌ها با سرگروه، تعداد اعضا، مثبت و منفی؛ دکمهٔ + بالای صفحه گروه تازه می‌سازد */
PAGES.grp = r => {
  const c = C(), L = GRP(c);
  /* مرتب‌سازی | Ranking: گروهی که تفاضل مثبت منهای منفی بیشتری دارد بالاتر است؛ در برابری، مثبت بیشتر مقدم است؛ رنگ هر گروه مطابق جایگاه اصلی ثابت می‌ماند */
  const rows = L.map((g, i) => ({ g, i })).sort((a, b) => (arr(b.g.p).length - arr(b.g.n).length) - (arr(a.g.p).length - arr(a.g.n).length) || arr(b.g.p).length - arr(a.g.p).length || a.i - b.i).map(({ g, i }) => {
    const hd = stuById(c, g.hd), n = grpMem(c, g).length;
    return rowH({ lead: icSq('groups', GRP_COL[i % GRP_COL.length]), ttl: esc(g.nm || 'گروه'), sub: (hd ? 'سرگروه: ' + esc(sn(hd)) + ' · ' : '') + fn(n) + ' عضو', trail: grpPnH(g), chev: true, attr: pushA('grpOne', { gid: g.id }) });
  }).join('');
  return { title: 'گروه‌بندی', large: true, tabs: true, lead: leaveBtn, trail: edBtn('grpAdd'),
    body: L.length ? '<div class="pad-x qc-wrap qc-two"><button class="btn tinted qc-btn" data-act="gqOpen">' + ppl('duo') + 'شایستگی گروه‌ها</button><button class="btn qc-neg" data-act="ghOpen">تاریخچه عملکرد</button></div><div class="group">' + rows + '</div><div class="group-f center" style="margin-top:-8px">' + fn(L.length) + ' گروه · ' + fn(STU(c).filter(x => !L.some(g => arr(g.m).map(String).includes(String(x.id)))).length) + ' دانش‌آموز بدون گروه</div>' : emptyH('groups', 'هنوز گروهی نساخته‌ای', 'با دکمهٔ + بالای صفحه یک گروه تازه بساز.') };
};

/* ---- ۱۹.۳ صفحهٔ یک گروه | 19.3 One Group Page ---- */
/* فهرست ثبت‌ها | Entry List: مثبت‌ها (w=p) یا منفی‌های (w=n) ثبت‌شدهٔ گروه، تازه‌ترین اول، با توضیح اختیاری و دکمهٔ حذف */
const grpEntH = (g, w) => {
  const L = arr(g[w]).slice().reverse(); if (!L.length) return '';
  return groupH(w === 'p' ? 'مثبت‌های ثبت‌شده' : 'منفی‌های ثبت‌شده', L.map(e => rowH({ ttl: esc(e.t || 'بدون توضیح'), sub: e.d ? esc(jFull(kdate(e.d))) : '', wrap: true,
    trail: '<button class="grp-del" data-act="grpDelE" data-a="' + esc(g.id) + '" data-b="' + w + '|' + esc(e.id) + '" aria-label="حذف">' + ico('trash') + '</button>' })).join(''));
};
/* صفحهٔ یک گروه | One Group Page: دو کارت مثبت و منفی با دکمهٔ ثبت، فهرست اعضا (سرگروه اول) و فهرست ثبت‌ها؛ دکمهٔ مداد گروه را ویرایش می‌کند */
PAGES.grpOne = r => {
  const c = C(), g = grpById(c, r.p.gid);
  if (!g) return { title: 'گروه', body: emptyH('groups', 'گروه پیدا نشد', 'شاید حذف شده باشد.') };
  const M = grpMem(c, g);
  /* کپسول مثبت و منفی | Pos/Neg Capsule: مثل مشخصات دانش‌آموز، یک کپسول با دو ستون جداشده با خط؛ لمسش تاریخچهٔ گروه را باز می‌کند */
  const pn = '<div class="grp-pn1"><button class="stat pn2" data-act="grpHist" data-a="' + esc(g.id) + '"><span class="pn2c green"><b>' + ppl('pos') + '<bdi dir="ltr">' + fn(arr(g.p).length) + '</bdi></b><span>مثبت</span></span><span class="pn2c red"><b>' + ppl('neg') + '<bdi dir="ltr">' + fn(arr(g.n).length) + '</bdi></b><span>منفی</span></span></button></div>';
  const mem = M.length
    ? groupH('اعضا (' + fn(M.length) + ')', M.map(s => rowH({ lead: avatar(s, 40), ttl: stnH(s), sub: String(s.id) === String(g.hd) ? '<span class="tag">سرگروه</span>' : '' })).join(''))
    : groupH('اعضا', rowH({ ttl: '<span class="muted">هنوز عضوی انتخاب نشده؛ با دکمهٔ مداد اضافه کن</span>', wrap: true }));
  return { title: g.nm || 'گروه', trail: edBtn('grpEdit', { gid: g.id }),
    body: pn + mem };
};

/* ---- ۱۹.۴ ثبت مثبت و منفی | 19.4 Recording Pos/Neg ---- */
/* ثبت مثبت یا منفی | Add Entry: دکمهٔ ثبت برگه‌ای باز می‌کند که توضیح اختیاری می‌پرسد؛ w = p مثبت، n منفی */
ACT.grpAddE = (el, gid, w) => {
  Sheet.open({ title: w === 'p' ? 'مثبت برای گروه' : 'منفی برای گروه',
    body: '<div class="pad-x"><div class="hw-lab">توضیح (اختیاری)</div><textarea class="fld" id="grpWhy" rows="3" maxlength="200" placeholder="اگر خواستی دلیل را بنویس"></textarea><div class="spacer"></div><button class="btn primary" data-act="grpAddSave" data-a="' + esc(gid) + '" data-b="' + w + '">ثبت</button></div>' });
};
/* ذخیرهٔ ثبت | Save Entry: یک مثبت یا منفی با تاریخ امروز و توضیح (اگر نوشته شده) به گروه اضافه می‌شود */
/* گام + و − | Step Plus/Minus: + برگهٔ دلیل را باز می‌کند؛ − آخرین مثبت یا منفی گروه را برمی‌دارد */
ACT.grpStep = (el, gid, w) => {
  const k = w[0]; if (w[1] === '+') return ACT.grpAddE(el, gid, k);
  const L = grpCopy(GRP(C())), g = L.find(x => String(x.id) === String(gid)); if (!g || !arr(g[k]).length) return;
  g[k] = arr(g[k]).slice(0, -1);
  if (!grpPut(L)) return toast('ثبت نشد', true);
  Nav.refresh();
};
ACT.grpAddSave = (el, gid, w) => {
  const c = C(), L = grpCopy(GRP(c)), g = L.find(x => String(x.id) === String(gid)); if (!g) return;
  const t = String(($('#grpWhy') || {}).value || '').trim(), e = { id: edId('e'), d: dkey(new Date()) };
  if (t) e.t = t;
  g[w] = arr(g[w]).concat([e]);
  if (!grpPut(L)) return toast('ثبت نشد', true);
  Sheet.close(); toast('ثبت شد'); Nav.refresh();
};
/* حذف یک ثبت | Delete Entry: بعد از تأیید، همان مثبت یا منفی از گروه برداشته می‌شود */
ACT.grpDelE = (el, gid, b) => {
  const [w, eid] = String(b).split('|');
  ask('این مورد حذف شود؟', 'حذف', () => {
    const c = C(), L = grpCopy(GRP(c)), g = L.find(x => String(x.id) === String(gid)); if (!g) return;
    g[w] = arr(g[w]).filter(e => String(e.id) !== eid);
    if (!grpPut(L)) return toast('حذف نشد', true);
    toast('حذف شد'); Nav.refresh();
  }, true);
};

/* کپسول شایستگی گروه | Group Capsule: دکمهٔ «شایستگی گروه‌ها» برگه‌ای باز می‌کند؛ برای هر گروه یک کپسول مثبت و منفی مثل شایستگی کلاس؛ نوشتن دلیل اختیاری است */
let GQ = null;
const gqCap = g => { const c = (w, v, cls) => '<span class="qcg ' + cls + '"><button class="stp" data-act="gqA" data-a="' + esc(g.id) + '" data-b="' + w + '+" aria-label="زیاد">' + ico('plus') + '</button><b class="qv' + (v ? ' ' + cls : '') + '"><bdi dir="ltr">' + (v ? (w === 'p' ? '+' : '−') + fn(v) : fn(0)) + '</bdi></b><button class="stp" data-act="gqA" data-a="' + esc(g.id) + '" data-b="' + w + '-" aria-label="کم">' + ico('minus') + '</button></span>'; return '<span class="qcc">' + c('p', arr(g.p).length, 'pos') + c('n', arr(g.n).length, 'neg') + '</span>'; };
const gqBody = () => {
  const c = C(), L = GRP(c);
  if (GQ.rs) { const g = grpById(c, GQ.rs.gid); return '<div class="sec-sub">' + esc(g ? g.nm || 'گروه' : '') + ' · ' + (GQ.rs.w === 'p' ? 'شایستگی مثبت' : 'شایستگی منفی') + '</div><div class="pad-x"><div class="hw-lab">دلیل (اختیاری)</div><input class="fld" id="gqWhy" data-enter="gqWhySave" maxlength="120" placeholder="اگر خواستی دلیل را بنویس"><div class="spacer"></div><button class="btn primary" data-act="gqWhySave">ثبت</button><div class="spacer"></div><button class="btn gray" data-act="gqWhySkip">لغو</button></div>'; }
  return L.length ? '<div class="group">' + L.map(g => '<div class="row qcr"><span class="ttl">' + esc(g.nm || 'گروه') + '</span>' + gqCap(g) + '</div>').join('') + '</div>' : emptyH('groups', 'هنوز گروهی نساخته‌ای', '');
};
const gqPaint = () => { const b = $('#gqBody'); if (b && GQ) Morph.html(b, gqBody()); };
ACT.gqOpen = () => { if (!GRP(C()).length) return; GQ = { rs: null }; Sheet.open({ title: 'شایستگی گروه‌ها', body: '<div id="gqBody">' + gqBody() + '</div>', after: sh => { const cl = sh.querySelector('[data-act=sheetClose]'); if (cl) cl.addEventListener('click', () => { GQ = null; Nav.refresh(); }); } }); };
/* افزودن یا کم‌کردن | Add or Remove: + دلیل (اختیاری) می‌پرسد؛ − آخرین مورد را برمی‌دارد */
ACT.gqA = (el, gid, w) => {
  if (!GQ) return; const k = w[0];
  if (w[1] === '+') { GQ.rs = { gid, w: k }; gqPaint(); const f = $('#gqWhy'); if (f) setTimeout(() => f.focus(), 250); return; }
  const L = grpCopy(GRP(C())), g = L.find(x => String(x.id) === String(gid)); if (!g || !arr(g[k]).length) return;
  g[k] = arr(g[k]).slice(0, -1);
  if (!grpPut(L)) return toast('ثبت نشد', true);
  gqPaint();
};
ACT.gqWhySave = () => {
  const rs = GQ && GQ.rs; if (!rs) return;
  const L = grpCopy(GRP(C())), g = L.find(x => String(x.id) === String(rs.gid)); if (!g) { GQ.rs = null; return gqPaint(); }
  const t = String(($('#gqWhy') || {}).value || '').trim(), e = { id: edId('e'), d: dkey(new Date()) }; if (t) e.t = t;
  g[rs.w] = arr(g[rs.w]).concat([e]);
  if (!grpPut(L)) return toast('ثبت نشد', true);
  GQ.rs = null; gqPaint();
};
ACT.gqWhySkip = () => { if (GQ) { GQ.rs = null; gqPaint(); } };
/* تاریخچه عملکرد گروه‌ها | Group History: به تفکیک گروه؛ برای هر گروه یک کارت با شمارش مثبت و منفی و فهرست زمانیِ ثبت‌ها (جدیدترین اول)؛ فیلتر روز، ماه یا همه؛ تک‌ستونی برای موبایل؛ حالت ویرایش برای تغییر دلیل و حذف */
let GH = null;
const ghAll = c => { const out = []; GRP(c).forEach(g => ['p', 'n'].forEach(w => arr(g[w]).forEach((e, i) => out.push({ id: g.id + '|' + w + '|' + e.id, g, w, i, k: String(e.d || ''), why: String(e.t || '').trim() })))); return out.sort((a, b) => (a.k < b.k ? 1 : a.k > b.k ? -1 : b.i - a.i)); };
const ghList = c => ghAll(c).filter(e => (!GH.gid || String(e.g.id) === String(GH.gid)) && (GH.f === 'all' || (e.k && (GH.f === 'day' ? e.k === GH.k : GH.f === 'week' ? inWk(e.k, GH.k) : pnYm(e.k) === GH.ym))));
/* ردیف یک ثبت | Entry Row: دایرهٔ + یا −، دلیل و تاریخ (در نمای روز تاریخ لازم نیست)؛ در ویرایش، دایرهٔ انتخاب و کادر دلیل */
const ghEnt = e => '<div class="gh-e ' + (e.w === 'p' ? 'pos' : 'neg') + (GH.sel.has(e.id) ? ' sel' : '') + '">' + (GH.edit ? '<span class="pn-ck" data-act="ghSel" data-a="' + esc(e.id) + '">' + ico('check') + '</span>' : '')
  + '<span class="gh-s">' + (e.w === 'p' ? '+' : '\u2212') + '</span><div class="gh-t">'
  + (GH.edit ? '<textarea class="fld pn-in" rows="1" data-in="pnGrow" data-chg="ghWhy" data-a="' + esc(e.id) + '" maxlength="200" placeholder="دلیل (اختیاری)">' + esc(e.why) + '</textarea>' : '<span>' + esc(e.why || 'بدون توضیح') + '</span>')
  + (e.k && GH.f !== 'day' ? '<small>' + esc(jFull(kdate(e.k))) + '</small>' : '') + '</div></div>';
/* ردیف یک ثبت به سبک مشخصات دانش‌آموز | Student-Style Entry: شماره، دلیل (و در ویرایش کادر دلیل) */
const ghPe = (e, i) => '<div class="pn-e' + (GH.sel.has(e.id) ? ' sel' : '') + '">' + (GH.edit ? '<span class="pn-ck" data-act="ghSel" data-a="' + esc(e.id) + '">' + ico('check') + '</span>' : '')
  + '<div class="pn-t"><span class="pn-no">' + fn(i + 1) + '.</span>' + (GH.edit ? '<textarea class="fld pn-in" rows="1" data-in="pnGrow" data-chg="ghWhy" data-a="' + esc(e.id) + '" maxlength="200" placeholder="دلیل (اختیاری)">' + esc(e.why) + '</textarea>' : '<span>' + esc(e.why || 'بدون توضیح') + '</span>') + '</div></div>';
/* کپسول هر روز | Day Capsule: ثبت‌های یک روز زیر یک کپسول؛ با لمس باز می‌شود */
const ghDays = (L, w) => {
  const G = {}, order = []; L.forEach(e => { const k = e.k || '-'; if (!G[k]) { G[k] = []; order.push(k); } G[k].push(e); });
  return order.map(k => {
    const g = G[k], id = w + ':' + k, open = GH.edit || GH.open.has(id), n = g.length, all = g.every(e => GH.sel.has(e.id));
    return '<div class="pn-g' + (open && n > 1 ? ' open' : '') + '"><div class="pn-cap" data-act="' + (GH.edit ? 'ghGrp' : n > 1 ? 'ghTog' : 'noop') + '" data-a="' + esc(id) + '">'
      + (GH.edit ? '<span class="pn-ck' + (all ? ' on' : '') + '">' + ico('check') + '</span>' : '') + '<b>' + esc(k === '-' ? 'بدون تاریخ' : jFull(kdate(k))) + '</b>' + (n > 1 ? '<i>' + fn(n) + '</i>' + (GH.edit ? '' : ico('chev-l')) : '') + '</div>'
      + (n === 1 && !GH.edit ? '<small class="pn-p"><span class="pn-no">' + fn(1) + '.</span> ' + esc(g[0].why || 'بدون توضیح') + '</small>' : '')
      + (open && (n > 1 || GH.edit) ? '<div class="pn-es">' + g.map((e, i) => ghPe(e, i)).join('') + '</div>' : '') + '</div>';
  }).join('');
};
/* نمای یک گروه | One-Group View: مثل مشخصات دانش‌آموز؛ فیلتر هفته، ماه، همه و دو ستون مثبت و منفی */
const ghOne = () => {
  const c = C(), all = ghAll(c).filter(e => String(e.g.id) === String(GH.gid)), L = ghList(c), P = L.filter(e => e.w === 'p'), N = L.filter(e => e.w === 'n');
  let h = segH([['week', 'هفته'], ['month', 'ماه'], ['all', 'همه']], GH.f, 'ghF');
  if (GH.f === 'week') h += wkNav(GH.k, 'ghW');
  if (GH.f === 'month') { const ms = [...new Set(all.filter(e => e.k).map(e => pnYm(e.k)).concat([GH.ym]))].sort((a, b) => a - b); h += '<div class="pn-months">' + ms.map(m => '<button class="chip' + (m === GH.ym ? ' on' : '') + '" data-act="ghM" data-a="' + m + '">' + pnYmT(m) + '</button>').join('') + '</div>'; }
  const col = (E, t, cls, w) => '<div class="pn-col ' + cls + '"><div class="pn-h">' + ppl(w === 'p' ? 'pos' : 'neg') + ' ' + t + ' <b>' + fn(E.length) + '</b></div>' + (E.length ? ghDays(E, w) : '<div class="pn-0">ندارد</div>') + '</div>';
  return h + '<div class="pn-grid">' + col(P, 'مثبت‌ها', 'pos', 'p') + col(N, 'منفی‌ها', 'neg', 'n') + '</div>';
};
const ghBody = () => {
  if (GH.gid) return ghOne();
  const c = C(), all = ghAll(c), L = ghList(c), G = {}, order = [];
  L.forEach(e => { const k = String(e.g.id); if (!G[k]) { G[k] = []; order.push(k); } G[k].push(e); });
  order.sort((a, b) => (G[b].filter(e => e.w === 'p').length - G[b].filter(e => e.w === 'n').length) - (G[a].filter(e => e.w === 'p').length - G[a].filter(e => e.w === 'n').length));
  let h = segH([['day', 'روز'], ['week', 'هفته'], ['month', 'ماه'], ['all', 'همه']], GH.f, 'ghF');
  if (GH.f === 'day') h += '<div class="qc-nav"><button class="dnav" data-act="ghD" data-a="-1" aria-label="روز قبل">' + ico('chev-r') + '</button><b>' + esc(jFull(kdate(GH.k))) + '</b><button class="dnav" data-act="ghD" data-a="1" aria-label="روز بعد">' + ico('chev-l') + '</button></div>';
  if (GH.f === 'week') h += wkNav(GH.k, 'ghW');
  if (GH.f === 'month') { const ms = [...new Set(all.filter(e => e.k).map(e => pnYm(e.k)).concat([GH.ym]))].sort((a, b) => a - b); h += '<div class="pn-months">' + ms.map(m => '<button class="chip' + (m === GH.ym ? ' on' : '') + '" data-act="ghM" data-a="' + m + '">' + pnYmT(m) + '</button>').join('') + '</div>'; }
  if (!order.length) return h + emptyH('groups', 'موردی ثبت نشده', GH.f === 'all' ? 'با دکمهٔ «شایستگی گروه‌ها» مثبت یا منفی ثبت کن.' : 'برای این بازه چیزی ثبت نشده است.');
  return h + '<div class="gh-list">' + order.map(k => {
    const E = G[k], g = E[0].g, P = E.filter(e => e.w === 'p').length, N = E.length - P, col = !GH.edit && GH.col.has(k), all2 = E.every(e => GH.sel.has(e.id));
    return '<div class="gh-g' + (col ? ' col' : '') + '"><div class="gh-hd" data-act="' + (GH.edit ? 'ghGrp' : 'ghTog') + '" data-a="' + esc(k) + '">' + (GH.edit ? '<span class="pn-ck' + (all2 ? ' on' : '') + '">' + ico('check') + '</span>' : '')
      + '<b>' + esc(g.nm || 'گروه') + '</b><span class="ab-row"><span class="ab-p pos">' + ppl('pos') + '<b>' + fn(P) + '</b></span><span class="ab-p neg">' + ppl('neg') + '<b>' + fn(N) + '</b></span></span>' + (GH.edit ? '' : ico('chev-l', 'chev')) + '</div>'
      + '<div class="gh-es">' + E.map(ghEnt).join('') + '</div></div>';
  }).join('') + '</div>';
};
const ghAct = () => '<button class="cap-b ic' + (GH.edit ? ' solid' : ' tint') + '" data-act="ghEdit" aria-label="ویرایش">' + ico('pencil') + '</button>' + (GH.edit ? '<button class="cap-b red" data-act="ghDel" aria-label="حذف"' + (GH.sel.size ? '' : ' disabled') + '>' + ico('trash') + (GH.sel.size ? ' ' + fn(GH.sel.size) : '') + '</button>' : '');
const ghPaint = () => { const b = $('#ghBody'); if (b && GH) { Morph.html(b, ghBody()); $$('.pn-in', b).forEach(pnGrow); } const a = $('#shAct'); if (a && GH) Morph.html(a, ghAct()); };
const ghShow = () => Sheet.open({ title: GH.gid ? (((grpById(C(), GH.gid) || {}).nm) || 'گروه') : 'تاریخچه عملکرد', act: ghAct(), body: '<div id="ghBody">' + ghBody() + '</div>' });
ACT.ghOpen = () => { const tk = dkey(defDay()); GH = { f: 'all', k: tk, ym: pnYm(tk), edit: false, sel: new Set(), col: new Set(), open: new Set() }; ghShow(); };
/* لمس مثبت یا منفی گروه | Open Group Entries: از کارت‌های صفحهٔ گروه؛ تاریخچهٔ همان گروه به سبک مشخصات دانش‌آموز باز می‌شود */
ACT.grpHist = (el, gid) => { const tk = dkey(defDay()), all = ghAll(C()).filter(e => String(e.g.id) === String(gid) && e.k); GH = { gid, f: 'month', k: tk, ym: all.length ? pnYm(all[0].k) : pnYm(tk), edit: false, sel: new Set(), col: new Set(), open: new Set() }; ghShow(); };
ACT.ghF = (el, a) => { GH.f = a; GH.sel.clear(); ghPaint(); };
ACT.ghD = (el, a) => { const d = kdate(GH.k); d.setDate(d.getDate() + +a); GH.k = dkey(d); GH.ym = pnYm(GH.k); GH.sel.clear(); ghPaint(); };
ACT.ghW = (el, a) => { const d = kdate(GH.k); d.setDate(d.getDate() + 7 * +a); GH.k = dkey(d); GH.ym = pnYm(GH.k); GH.sel.clear(); ghPaint(); };
ACT.ghM = (el, a) => { GH.ym = +a; GH.sel.clear(); ghPaint(); };
ACT.ghTog = (el, id) => { const S2 = String(id).includes(':') ? GH.open : GH.col; S2.has(id) ? S2.delete(id) : S2.add(id); ghPaint(); };
ACT.ghEdit = () => { GH.edit = !GH.edit; GH.sel.clear(); ghPaint(); };
ACT.ghSel = (el, id) => { GH.sel.has(id) ? GH.sel.delete(id) : GH.sel.add(id); ghPaint(); };
ACT.ghGrp = (el, id) => { const L = ghList(C()).filter(e => String(id).includes(':') ? (e.w + ':' + (e.k || '-')) === id : String(e.g.id) === id), all = L.every(e => GH.sel.has(e.id)); L.forEach(e => (all ? GH.sel.delete(e.id) : GH.sel.add(e.id))); ghPaint(); };
/* ویرایش دلیل | Edit Reason: دلیل همان مورد عوض می‌شود (خالی هم مجاز است) و ذخیره می‌شود */
ACT.ghWhy = (el, v) => {
  const [gid, w, eid] = String(el.dataset.a).split('|'), L = grpCopy(GRP(C())), g = L.find(x => String(x.id) === gid), e = g && arr(g[w]).find(x => String(x.id) === eid); if (!e) return;
  const old = e.t || ''; if (String(v).trim()) e.t = String(v).trim(); else delete e.t;
  if (!grpPut(L)) { el.value = old; return; }
  toast('ذخیره شد');
};
/* حذف با تأیید | Confirmed Delete: موردهای انتخاب‌شده از گروه‌ها برداشته می‌شود؛ بعد برگه دوباره باز می‌شود */
ACT.ghDel = () => {
  if (!GH || !GH.sel.size) return; const E = ghAll(C()).filter(e => GH.sel.has(e.id)), n = E.length;
  Sheet.action({ msg: fn(n) + ' مورد حذف شود؟ این کار برگشت‌پذیر نیست.', items: [{ t: 'حذف ' + fn(n) + ' مورد', cls: 'destructive', fn: () => {
    const L = grpCopy(GRP(C())); E.forEach(x => { const g = L.find(y => String(y.id) === String(x.g.id)), eid = x.id.split('|')[2]; if (g) g[x.w] = arr(g[x.w]).filter(y => String(y.id) !== eid); });
    const ok = grpPut(L); toast(ok ? 'حذف شد' : 'حذف نشد', !ok); GH.sel.clear(); Nav.refresh(); setTimeout(ghShow, 150);
  } }], onCancel: () => ghShow() });
};

/* ---- ۱۹.۵ فرم گروه | 19.5 Group Form ---- */
/* فرم گروه | Group Form: نام گروه، انتخاب سرگروه و انتخاب اعضا با لمس نام‌ها؛ هر دانش‌آموز فقط در یک گروه است (اگر در گروه دیگری بود، با ذخیره از آن گروه برداشته می‌شود) */
const grpForm = gid => {
  const c = C(), cur = gid ? grpById(c, gid) : null; if (gid && !cur) return;
  const all = STU(c), mem = new Set(arr(cur && cur.m).map(String)), where = {};
  GRP(c).forEach(x => { if (!cur || String(x.id) !== String(cur.id)) arr(x.m).forEach(id => { where[String(id)] = x.nm || 'گروه'; }); });
  /* ردیف انتخاب | Pick Row: آواتار و نام؛ سمت چپ ستارهٔ سرگروه (فقط برای عضو) و دکمهٔ حبابی + (افزودن) یا − (برداشتن) */
  const pick = (s, mm) => { const id = String(s.id), on = mem.has(id), hd = cur && String(cur.hd) === id && on;
    return '<div class=\"row has-lead grp-pick' + (mm ? ' mm' : '') + (on ? ' on' : '') + (hd ? ' hd' : '') + '\" data-s=\"' + esc(id) + '\"><span class=\"lead\">' + avatar(s, 40) + '</span><span class=\"main\"><div class=\"ttl\">' + esc(sn(s)) + '</div></span><span class=\"trail\"><button class=\"grp-hdb\" data-act=\"grpHd\" data-s=\"' + esc(id) + '\" aria-label=\"سرگروه\">' + ico('star') + '</button><button class=\"grp-bub\" data-act=\"grpPick\" data-s=\"' + esc(id) + '\" aria-label=\"تغییر عضویت\"><span class=\"p\">' + ico('plus') + '</span><span class=\"m\">' + ico('minus') + '</span></button></span></div>'; };
  /* دو بخش | Two Sections: اعضای فعلی این گروه، و دانش‌آموزانی که هیچ گروهی ندارند؛ دانش‌آموزِ عضو گروه دیگر نمایش داده نمی‌شود */
  const cm = all.filter(s => mem.has(String(s.id))), fr = all.filter(s => !mem.has(String(s.id)) && !where[String(s.id)]);
  const extra = '<div class=\"grp-sel-w\" id=\"grpSelW\"' + (cm.length ? '' : ' hidden') + '><div class=\"group-h\">اعضای گروه · با ستاره سرگروه را انتخاب کن</div><div class=\"group\" id=\"grpSelG\">' + cm.map(s => pick(s, true)).join('') + '</div></div>'
    + '<div class=\"group-h\">' + (cur ? 'افزودن دانش‌آموز بدون گروه' : 'دانش‌آموزان بدون گروه') + '</div><div class=\"group\" id=\"grpFreeG\">' + (fr.length ? fr.map(s => pick(s, false)).join('') : rowH({ ttl: '<span class=\"muted\">دانش‌آموزِ بدون گروه نمانده</span>' })) + '</div>';
  edSheet({ title: cur ? 'ویرایش گروه' : 'گروه تازه', req: ['nm'], extra,
    fields: [{ k: 'nm', l: 'نام گروه', v: cur ? cur.nm : '' }],
    save: (vals, ch, sh) => {
      const L = grpCopy(GRP(C())), sel = $$('.grp-pick.on', sh).map(b => String(b.dataset.s)), hdEl = $('.grp-pick.hd', sh), hd = hdEl ? String(hdEl.dataset.s) : '';
      if (hd && !sel.includes(hd)) sel.push(hd);
      let g = cur && L.find(x => String(x.id) === String(cur.id));
      if (!g) { g = { id: edId('g'), p: [], n: [] }; L.push(g); }
      g.nm = vals.nm; g.hd = hd; g.m = sel;
      L.forEach(x => { if (x === g) return; x.m = arr(x.m).filter(id => !sel.includes(String(id))); if (x.hd && sel.includes(String(x.hd))) x.hd = ''; });
      return grpPut(L);
    },
    del: cur ? { label: 'حذف گروه', msg: 'این گروه با همهٔ مثبت و منفی‌هایش حذف شود؟', back: true, fn: () => grpPut(GRP(C()).filter(x => String(x.id) !== String(cur.id))) } : undefined });
};
/* بازکننده‌ها | Group Form Openers: دکمهٔ + (گروه تازه) و دکمهٔ مداد (ویرایش گروه) */
ED_FORMS.grpAdd = () => grpForm();
ED_FORMS.grpEdit = p => grpForm(p.gid);
/* انتخاب عضو | Pick Member Chip: لمس نام دانش‌آموز او را عضو گروه می‌کند یا برمی‌دارد */
/* دکمهٔ حبابی | Member Bubble: عضویت را روشن/خاموش می‌کند؛ با خاموش شدن، ستارهٔ سرگروهِ همان ردیف هم برداشته می‌شود */
ACT.grpPick = el => { const row = el.closest('.grp-pick'), on = row.classList.toggle('on'); if (!on) row.classList.remove('hd');
  /* جدا کردن انتخاب‌شده‌ها | Separate Selected: دانش‌آموزِ انتخاب‌شده به بخش جدای بالا می‌رود (با فاصله از بقیه)؛ با برداشتن، به فهرست پایین برمی‌گردد */
  const w = $('#grpSelW'), sg = $('#grpSelG'), fg = $('#grpFreeG'); if (!w || !sg || !fg) return;
  if (on) { $$('.row:not(.grp-pick)', fg).forEach(r => r.remove()); sg.appendChild(row); } else fg.insertBefore(row, fg.firstChild);
  w.hidden = !sg.querySelector('.grp-pick'); };
/* لمس ستاره | Pick Head: همان دانش‌آموز سرگروه می‌شود و از بقیه برداشته می‌شود؛ لمس دوباره سرگروه را برمی‌دارد */
ACT.grpHd = el => { const row = el.closest('.grp-pick'), was = row.classList.contains('hd'); $$('.grp-pick.hd').forEach(r => r.classList.remove('hd')); if (!was) row.classList.add('hd'); };


/* ================================================================
   ۱۷) راه‌اندازی | 17) Boot
   اولین کاری که با باز شدن برنامه انجام می‌شود: ظاهر، نوار تب، رویدادها، حافظه، و تصمیم بین ورود و بارگذاری.
   ================================================================ */

/* راه‌اندازی | Boot: اگر قبلاً وارد شده باشد مستقیم از سرور می‌گیرد، وگرنه صفحهٔ ورود را نشان می‌دهد؛ نشانی با #demo یک‌راست دادهٔ نمایشی را باز می‌کند */
(async function boot() {
  Look.apply(); Tabs.render(); bindEvents();
  await Cache.open();
  /* نسخهٔ ذخیره‌شده | Stored Override: روی آدرس http/https هرگز به blob: نمی‌رویم (چون «افزودن به صفحهٔ اصلی» را خراب می‌کند)؛ نسخهٔ ذخیره‌شدهٔ ovr پاک می‌شود و خود فایل میزبان اجرا می‌شود */
  if (/^https?:$/.test(location.protocol)) {
    try { await Cache.del('kv', 'ovr'); } catch (e) { /* مهم نیست */ }
  } else if (location.protocol !== 'blob:' && location.protocol !== 'file:') {
    const ov = await Cache.get('kv', 'ovr');
    if (ov && ov.base !== HOST_BUILD) { Cache.del('kv', 'ovr'); Pref.del('updinst'); Pref.del('updlast'); }
    else if (ov && ov.html) { try { location.replace(URL.createObjectURL(new Blob([ov.html], { type: 'text/html' })) + location.hash); return; } catch (e) { /* ادامه با نسخهٔ خود فایل */ } }
  }
  /* سرویس‌ورکر | Service Worker Register: فقط روی آدرس وب ثبت می‌شود (نه فایل محلی و نه نسخهٔ blob) */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  Srv.load(); setTimeout(Upd.auto, 6000);
  if (location.hash === '#demo') return Auth.demo();
  if (Srv.has()) Auth.load(); else Screen.login();
})();


</script>
